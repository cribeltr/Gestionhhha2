    { tipo: "envio_st", label: "Envío a Servicio Técnico" },
    { tipo: "retorno_st", label: "Retorno de Servicio Técnico" },
    { tipo: "visita_ejecucion", label: "Visita / Ejecución realizada" },
    { tipo: "cierre", label: "Cierre del expediente" },
  ];
  F._avancesCatalogo = AVANCES;

  F.registrarAvance = function (expId, tipoSugerido, onSaved) {
    const x = Store.db.expedientes.find((e) => e.id === expId);
    if (!x) return;

    const fTipo = select(AVANCES.map((a) => ({ value: a.tipo, label: a.label })), tipoSugerido);
    const fFecha = input({ type: "date", value: U.todayISO() });
    const dyn = el("div", { class: "form-grid" });

    function renderDyn() {
      dyn.innerHTML = "";
      const t = fTipo.value;
      if (t === "envio_st") {
        const emp = select(C.EMPRESAS); const num = input({ placeholder: "N° de envío (obligatorio)" });
        const desc = textarea({ placeholder: "Descripción (opcional)" });
        dyn._get = () => ({ empresa: emp.value, numeroEnvio: num.value, descripcion: desc.value });
        dyn._valid = () => emp.value && num.value.trim();
        dyn.appendChild(field("Empresa de destino", emp));
        dyn.appendChild(field("N° de envío", num));
        dyn.appendChild(field("Descripción", desc));
      } else if (t === "retorno_st") {
        const ultimoEnvio = (x.avances || []).slice().reverse().find((a) => a.tipo === "envio_st");
        const emp = select(C.EMPRESAS, ultimoEnvio && ultimoEnvio.datos ? ultimoEnvio.datos.empresa : "");
        const folio = input({ placeholder: "Folio de retorno (obligatorio)" });
        const quien = input({ placeholder: "Persona de la empresa (opcional)" });
        let estado = "Operativo";
        const seg = segmented(["Operativo", "No Operativo"], "Operativo", (v) => estado = v);
        dyn._get = () => ({ empresa: emp.value, folioRetorno: folio.value, quien: quien.value, estadoEquipo: estado });
        dyn._valid = () => folio.value.trim();
        dyn.appendChild(field("Folio Orden de Trabajo", el("div", { class: "readonly-val" }, x.folioSigem)));
        dyn.appendChild(field("Empresa", emp));
        dyn.appendChild(field("Folio de retorno", folio));
        dyn.appendChild(field("Quién lo envió", quien));
        dyn.appendChild(field("¿Cómo quedó el equipo?", seg));
      } else if (t === "visita_ejecucion") {
        let estado = "Operativo";
        const seg = segmented(["Operativo", "No Operativo"], "Operativo", (v) => estado = v);
        const nota = textarea({ placeholder: "Nota / respaldo (opcional)" });
        dyn._get = () => ({ estadoEquipo: estado, nota: nota.value });
        dyn._valid = () => true;
        dyn.appendChild(field("¿Cómo quedó el equipo?", seg));
        dyn.appendChild(field("Nota", nota));
      } else if (t === "cierre") {
        let estado = x.estadoEquipo || "Operativo";
        const seg = segmented(["Operativo", "No Operativo"], estado, (v) => estado = v);
        const nota = textarea({ placeholder: "Nota de cierre (opcional)" });
        dyn._get = () => ({ estadoEquipo: estado, nota: nota.value });
        dyn._valid = () => true;
        dyn.appendChild(field("Estado final del equipo", seg));
        dyn.appendChild(field("Nota de cierre", nota));
      } else {
        const num = input({ placeholder: "N° / referencia (opcional)" });
        const emp = select(C.EMPRESAS);
        const nota = textarea({ placeholder: "Detalle (opcional)" });
        dyn._get = () => ({ numero: num.value, empresa: emp.value, nota: nota.value });
        dyn._valid = () => true;
        dyn.appendChild(field("N° / referencia", num));
        if (t === "cotizacion_solicitada" || t === "cotizacion_recibida" || t === "oc_enviada")
          dyn.appendChild(field("Empresa / proveedor", emp));
        dyn.appendChild(field("Detalle", nota));
      }
      // Aviso cronológico
      validarCronologia();
    }
    const cronoHint = el("div", { class: "field-hint" });
    function validarCronologia() {
      const ult = (x.avances || []).map((a) => a.fechaReal).filter(Boolean).sort();
      const ultima = ult[ult.length - 1];
      if (ultima && fFecha.value < ultima) {
        cronoHint.innerHTML = "⚠️ La fecha es anterior al último hito (" + U.fmtDate(ultima) + "). Verifique el orden cronológico.";
      } else cronoHint.innerHTML = "";
    }
    fTipo.addEventListener("change", renderDyn);
    fFecha.addEventListener("change", validarCronologia);
    setTimeout(renderDyn, 0);

    const body = el("div", {}, [
      el("div", { class: "form-grid" }, [
        field("Tipo de avance", fTipo),
        field("Fecha real del hecho", fFecha),
      ]),
      cronoHint, dyn,
    ]);

    const m = UI.modal({
      title: "Registrar avance · Folio " + x.folioSigem,
      size: "md", body,
      footer: [
        UI.btn("Cancelar", "ghost", () => m.close()),
        UI.btn("Registrar", "primary", () => {
          if (dyn._valid && !dyn._valid()) { UI.toast("Complete los campos obligatorios.", "warn"); return; }
          Store.registrarAvance(expId, {
            tipo: fTipo.value, fechaReal: fFecha.value, datos: dyn._get ? dyn._get() : {},
          });
          UI.toast("Avance registrado.", "ok");
          m.close(); onSaved && onSaved();
        }),
      ],
    });
  };

})(window);


/* ===== assets/js/views/equipos.js ===== */
/* =========================================================================
 * MP 2026 · equipos.js  —  Paso 2: Vista de equipos
 * Tabla con columnas de la base + 4 calculadas (Estado, Días en estado,
 * Última actualización, Pendientes), filtros tipo Excel y filas abribles.
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const el = U.el;
  const Store = MP.store;

  function chipEstado(estado) {
    const cls = estado === "Operativo" ? "ok" : estado === "Servicio Técnico" ? "warn" : "bad";
    return el("span", { class: "chip estado-" + cls }, estado);
  }

  MP.views = MP.views || {};
  MP.views.equipos = function (container) {
    const equipos = Store.equipos();

    if (equipos.length === 0) {
      container.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-ico" }, "📭"),
        el("h2", {}, "Sin equipos cargados"),
        el("p", {}, "Importe la planilla ProgramaciónMP2026 (hoja PMP_2026) o cargue datos de demostración desde la pestaña «Datos»."),
        MP.ui.btn("Ir a Datos", "primary", () => MP.app.go("datos")),
      ]));
      return;
    }

    // Filas con calculados
    const rows = equipos.map((e) => {
      const key = U.equipoKey(e);
      const est = Store.estadoEquipo(key);
      const pend = Store.pendientesAbiertosDe(key);
      return {
        _eq: e, _key: key,
        id: e.id, nCarpeta: e.nCarpeta, nInventario: e.nInventario, equipo: e.equipo,
        servicio: e.servicio, unidad: e.unidad, ubicacion: e.ubicacion, procedencia: e.procedencia,
        marca: e.marca, modelo: e.modelo, serie: e.serie, anioInstalacion: e.anioInstalacion,
        vidaUtilResidual: e.vidaUtilResidual, clasificacion: e.clasificacion, enuBaja: e.enuBaja,
        _estado: est.estado, _dias: est.dias, _ultima: Store.ultimaActualizacion(key),
        _pend: pend.length,
      };
    });

    const cols = [
      { key: "id", label: "ID", align: "right", defaultVisible: false },
      { key: "nCarpeta", label: "N° Carpeta", defaultVisible: false },
      { key: "nInventario", label: "N° Inventario" },
      { key: "equipo", label: "Equipo" },
      { key: "servicio", label: "Servicio" },
      { key: "unidad", label: "Unidad", defaultVisible: false },
      { key: "ubicacion", label: "Ubicación", defaultVisible: false },
      { key: "procedencia", label: "Procedencia", defaultVisible: false },
      { key: "marca", label: "Marca" },
      { key: "modelo", label: "Modelo", defaultVisible: false },
      { key: "serie", label: "Serie" },
      { key: "anioInstalacion", label: "Año Inst.", defaultVisible: false, align: "right" },
      { key: "vidaUtilResidual", label: "Vida Útil Res.", defaultVisible: false, align: "right" },
      { key: "clasificacion", label: "Clasificación", defaultVisible: false },
      { key: "enuBaja", label: "ENU/Baja", defaultVisible: false },
      { key: "_estado", label: "Estado", render: (r) => chipEstado(r._estado), text: (r) => r._estado },
      { key: "_dias", label: "Días en estado", align: "right",
        render: (r) => el("span", {}, r._dias === null ? "—" : r._dias + " d"), text: (r) => r._dias === null ? "" : String(r._dias) },
      { key: "_ultima", label: "Última actualización",
        render: (r) => el("span", {}, r._ultima ? U.fmtDate(r._ultima) : "—"), text: (r) => r._ultima || "" },
      { key: "_pend", label: "Pendientes", align: "center",
        render: (r) => r._pend > 0 ? el("span", { class: "chip warn" }, r._pend) : el("span", { class: "muted" }, "0"),
        text: (r) => String(r._pend) },
    ];

    const dt = MP.ui.DataTable({
      columns: cols, rows, storageKey: "equipos", exportName: "Equipos_MP2026",
      onRowClick: (r) => MP.views.detalle(r._key),
      rowClass: (r) => r._estado === "No Operativo" ? "row-bad" : r._estado === "Servicio Técnico" ? "row-warn" : "",
    });
    container.appendChild(el("div", { class: "view-head" }, [
      el("h2", {}, "Equipos"),
      el("p", { class: "view-sub" }, equipos.length + " equipos · clic en una fila para ver el detalle."),
    ]));
    container.appendChild(dt.root);
  };

  MP.views._chipEstado = chipEstado;
})(window);


/* ===== assets/js/views/detalle.js ===== */
/* =========================================================================
 * MP 2026 · detalle.js  —  Paso 7: Vista de detalle del equipo
 * Datos copiables, historial unificado por mes, pendientes y expedientes
 * correctivos con línea de tiempo. Tres botones de acción.
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const C = MP.const;
  const el = U.el;
  const Store = MP.store;
  const UI = MP.ui;

  function copiable(label, valor) {
    const v = U.asText(valor);
    const cell = el("div", { class: "kv", title: "Clic para copiar" }, [
      el("div", { class: "kv-label" }, label),
      el("div", { class: "kv-value" }, v || "—"),
    ]);
    cell.addEventListener("click", () => {
      if (!v) return;
      navigator.clipboard && navigator.clipboard.writeText(v);
      cell.classList.add("copied");
      UI.toast("Copiado: " + v, "ok");
      setTimeout(() => cell.classList.remove("copied"), 600);
    });
    return cell;
  }

  MP.views = MP.views || {};
  MP.views.detalle = function (equipoKey) {
    const eq = Store.equipoByKey(equipoKey);
    if (!eq) { UI.toast("Equipo no encontrado.", "warn"); return; }

    const body = el("div", { class: "detalle" });
    const m = UI.modal({ title: eq.equipo + " — " + (eq.serie || eq.nInventario), size: "xl", body });

    function render() {
      body.innerHTML = "";
      const est = Store.estadoEquipo(equipoKey);
      const pendientes = Store.pendientesDe(equipoKey);
      const expedientes = Store.expedientesDe(equipoKey);

      // Encabezado con estado
      body.appendChild(el("div", { class: "detalle-top" }, [
        MP.views._chipEstado(est.estado),
        el("span", { class: "muted" }, est.dias === null ? "" : ("· " + est.dias + " días en estado")),
        el("span", { class: "muted" }, "· Última actualización: " +
          (Store.ultimaActualizacion(equipoKey) ? U.fmtDate(Store.ultimaActualizacion(equipoKey)) : "—")),
      ]));

      // Botones de acción (Paso 7)
      body.appendChild(el("div", { class: "detalle-actions" }, [
        UI.btn("🛠 Mantenimiento Preventivo", "primary", () => MP.forms.preventivo(equipoKey, render)),
        UI.btn("📋 Pendientes", "secondary", () => MP.forms.pendiente(equipoKey, render)),
        UI.btn("🔧 Mantenimiento Correctivo", "secondary", () => MP.forms.correctivo(equipoKey, render)),
      ]));

      // Datos del equipo (copiables)
      body.appendChild(el("h4", { class: "sec-title" }, "Datos del equipo"));
      body.appendChild(el("div", { class: "kv-grid" }, [
        copiable("ID", eq.id), copiable("N° Carpeta", eq.nCarpeta), copiable("N° Inventario", eq.nInventario),
        copiable("Equipo", eq.equipo), copiable("Servicio", eq.servicio), copiable("Unidad", eq.unidad),
        copiable("Ubicación", eq.ubicacion), copiable("Procedencia", eq.procedencia), copiable("Marca", eq.marca),
        copiable("Modelo", eq.modelo), copiable("Serie", eq.serie), copiable("Año Instalación", eq.anioInstalacion),
        copiable("Vida Útil Residual", eq.vidaUtilResidual), copiable("Clasificación", eq.clasificacion),
        copiable("ENU/Baja", eq.enuBaja),
      ]));

      // Historial de mantenciones unificado (una fila por mes)
      body.appendChild(el("h4", { class: "sec-title" }, "Historial de mantenciones " + new Date().getFullYear()));
      body.appendChild(historialUnificado(eq, equipoKey, render));

      // Pendientes
      body.appendChild(el("h4", { class: "sec-title" }, "Pendientes (" + pendientes.length + ")"));
      body.appendChild(pendientesMini(pendientes, render));

      // Expedientes correctivos con línea de tiempo
      body.appendChild(el("h4", { class: "sec-title" }, "Mantenimiento correctivo (" + expedientes.length + ")"));
      expedientes.forEach((x) => body.appendChild(expedienteCard(x, render)));
      if (expedientes.length === 0) body.appendChild(el("p", { class: "muted" }, "Sin expedientes correctivos."));
    }

    function historialUnificado(eq, key, onChange) {
      const mant = Store.mantencionesDe(key);
      const tbl = el("table", { class: "mini-table" });
      tbl.appendChild(el("thead", {}, el("tr", {}, [
        el("th", {}, "Mes"), el("th", {}, "Programa (planilla)"), el("th", {}, "Resultado (planilla)"),
        el("th", {}, "Registros app"), el("th", {}, ""),
      ])));
      const tb = el("tbody");
      C.MESES.forEach((mes) => {
        const prog = (eq.programacion && eq.programacion[mes.key]) || "";
        const reg = (eq.registro && eq.registro[mes.key]) || {};
        const mApp = mant.filter((x) => U.mesKeyFromISO(x.fecha) === mes.key);
        // Mostrar solo meses con algo
        if (!prog && !reg.programa && !reg.resultado && mApp.length === 0) return;
        const appCell = el("td", {}, mApp.map((x) =>
          el("div", { class: "mant-app" }, [
            el("span", { class: "tag " + (x.tipoRegistro === "Borrador" ? "tag-draft" : "tag-official") }, x.tipoRegistro),
            " " + U.fmtDate(x.fecha) + " · " + (x.programacion || "") + "/" + (x.resultado || "") + " · " + (x.ejecutor || ""),
          ])));
        tb.appendChild(el("tr", {}, [
          el("td", {}, mes.nombre),
          el("td", {}, prog ? el("span", { class: "code-pill" }, prog) : el("span", { class: "muted" }, "—")),
          el("td", {}, reg.resultado ? el("span", { class: "code-pill res" }, reg.resultado) : el("span", { class: "muted" }, "—")),
          appCell,
          el("td", {}),
        ]));
      });
      tbl.appendChild(tb);
      if (tb.children.length === 0) return el("p", { class: "muted" }, "Sin programación ni registros este año.");
      return tbl;
    }

    function pendientesMini(pendientes, onChange) {
      if (pendientes.length === 0) return el("p", { class: "muted" }, "Sin pendientes.");
      const wrap = el("div", { class: "pend-mini-list" });
      pendientes.forEach((p) => {
        const urg = Store.urgenciaPendiente(p);
        wrap.appendChild(el("div", { class: "pend-mini urg-" + U.norm(urg).replace(/\s/g, "-") }, [
          el("div", { class: "pend-mini-main" }, [
            el("span", { class: "chip " + (urg === "Completado" ? "ok" : urg === "Atrasado" ? "bad" : "warn") }, urg),
            el("b", {}, " " + p.tipo),
            el("div", { class: "muted" }, (p.descripcion || "") + " · Compromiso: " + U.fmtDate(p.fechaCompromiso) +
              " · " + Store.estadoPendiente(p)),
          ]),
          el("div", { class: "pend-mini-actions" }, [
            !p.fechaCompletado ? UI.btn("✓ Completar", "ghost sm", () => { Store.completarPendiente(p.id); onChange(); }) : null,
            UI.btn("Editar", "ghost sm", () => MP.forms.pendiente(p.equipoKey, onChange, p)),
          ]),
        ]));
      });
      return wrap;
    }

    function expedienteCard(x, onChange) {
      const etapa = Store.etapaExpediente(x);
      const card = el("div", { class: "exp-card" });
      card.appendChild(el("div", { class: "exp-head" }, [
        el("div", {}, [
          el("b", {}, "Folio " + x.folioSigem),
          el("span", { class: "chip " + (x.estadoEvento === "Cerrado" ? "ok" : "warn") }, " " + x.estadoEvento),
          el("span", { class: "chip neutral" }, etapa),
        ]),
        el("div", { class: "muted" }, x.tipoEvento + " · " + x.tecnico + " · " +
          Store.diasCicloExpediente(x) + " días de ciclo"),
      ]));
      if (x.requerimiento) card.appendChild(el("div", { class: "muted exp-req" }, "“" + x.requerimiento + "”"));

      // Registro en un clic: siguiente paso (Paso 12)
      card.appendChild(el("div", { class: "exp-quick" }, siguientePaso(x, onChange)));

      // Línea de tiempo
      const tl = el("div", { class: "timeline" });
      const avances = (x.avances || []).slice().sort((a, b) => (a.fechaReal || "").localeCompare(b.fechaReal || ""));
      // apertura
      tl.appendChild(timelineItem("Apertura — " + x.estadoEquipo, x.fechaDocumento, null, null, null));
      avances.forEach((a) => {
        const lbl = (MP.forms._avancesCatalogo.find((c) => c.tipo === a.tipo) || { label: a.tipo }).label;
        const det = detalleAvance(a);
        tl.appendChild(timelineItem(lbl, a.fechaReal, a.fechaRegistro, a.fechaCorreccion, det, () => {
          UI.confirm("¿Eliminar este avance de la bitácora?", () => { Store.eliminarAvance(x.id, a.id); onChange(); }, { danger: true, okText: "Eliminar" });
        }));
      });
      card.appendChild(tl);

      card.appendChild(el("div", { class: "exp-foot" }, [
        UI.btn("+ Registrar avance", "secondary sm", () => MP.forms.registrarAvance(x.id, "", onChange)),
        x.estadoEvento !== "Cerrado" ? UI.btn("Cerrar expediente", "ghost sm", () =>
          MP.forms.registrarAvance(x.id, "cierre", onChange)) : null,
      ]));
      return card;
    }

    function siguientePaso(x, onChange) {
      if (x.estadoEvento === "Cerrado") return el("span", { class: "muted" }, "Expediente cerrado el " + U.fmtDate(x.fechaCierre));
      const etapa = Store.etapaExpediente(x);
      let tipo = "evaluacion", label = "Evaluación técnica";
      if (etapa === C.ETAPAS_CORR.EN_ST) { tipo = "retorno_st"; label = "Registrar retorno de S.T."; }
      else if (etapa === C.ETAPAS_CORR.RETORNADO_OK) { tipo = "cierre"; label = "Cerrar expediente"; }
      else if (etapa === C.ETAPAS_CORR.RETORNADO_NOK) { tipo = "evaluacion", label = "Re-evaluar"; }
      else if (etapa === C.ETAPAS_CORR.COMPRA) { tipo = "oc_enviada"; label = "OC enviada al proveedor"; }
      else if (etapa === C.ETAPAS_CORR.ESPERA) { tipo = "visita_ejecucion"; label = "Visita / Ejecución realizada"; }
      else if (etapa === C.ETAPAS_CORR.EJECUCION) { tipo = "cierre"; label = "Cerrar expediente"; }
      else { tipo = "cotizacion_solicitada"; label = "Solicitar cotización"; }
      return el("div", {}, [
        el("span", { class: "muted" }, "Siguiente paso sugerido: "),
        UI.btn("▶ " + label + " (" + U.fmtDate(U.todayISO()) + ")", "primary sm",
          () => MP.forms.registrarAvance(x.id, tipo, onChange)),
      ]);
    }

    function detalleAvance(a) {
      const d = a.datos || {};
      const parts = [];
      if (d.numero) parts.push("N° " + d.numero);
      if (d.numeroEnvio) parts.push("Envío " + d.numeroEnvio);
      if (d.folioRetorno) parts.push("Retorno " + d.folioRetorno);
      if (d.empresa) parts.push(d.empresa);
      if (d.estadoEquipo) parts.push("→ " + d.estadoEquipo);
      if (d.quien) parts.push("(" + d.quien + ")");
      if (d.nota) parts.push(d.nota);
      if (d.descripcion) parts.push(d.descripcion);
      return parts.join(" · ");
    }

    function timelineItem(titulo, fechaReal, fechaReg, fechaCorr, detalle, onDel) {
      return el("div", { class: "tl-item" }, [
        el("div", { class: "tl-dot" }),
        el("div", { class: "tl-body" }, [
          el("div", { class: "tl-title" }, [
            el("b", {}, titulo), " ", el("span", { class: "tl-date" }, U.fmtDate(fechaReal)),
            fechaCorr ? el("span", { class: "tl-corr" }, " (corregido " + U.fmtDate(fechaCorr) + ")") : null,
            onDel ? el("button", { class: "icon-btn tl-del no-rowclick", title: "Eliminar avance", onclick: onDel }, "✕") : null,
          ]),
          detalle ? el("div", { class: "muted tl-det" }, detalle) : null,
          fechaReg && fechaReg !== fechaReal ? el("div", { class: "tl-reg" }, "Registrado: " + U.fmtDate(fechaReg)) : null,
        ]),
      ]);
    }

    render();
  };
})(window);


/* ===== assets/js/views/pendientes.js ===== */
/* =========================================================================
 * MP 2026 · pendientes.js  —  Paso 9: Bandeja de gestión de pendientes
 * Tabla tipo Excel, métricas de cabecera, acciones rápidas por fila,
 * filas expandibles con tareas, bitácora y caja de gestión.
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const el = U.el;
  const Store = MP.store;
  const UI = MP.ui;

  const URGENCIA_ORDEN = { "Atrasado": 0, "Hoy": 1, "Esta semana": 2, "Próximo": 3, "En espera": 4, "Completado": 5 };

  MP.views = MP.views || {};
  MP.views.pendientes = function (container) {
    const todos = Store.db.pendientes;

    container.appendChild(el("div", { class: "view-head" }, [
      el("h2", {}, "Bandeja de Pendientes"),
      el("p", { class: "view-sub" }, "Gestión de pendientes con urgencia, tareas y bitácora."),
    ]));

    // Métricas de cabecera
    const abiertos = todos.filter((p) => !p.fechaCompletado);
    const atrasados = abiertos.filter((p) => Store.urgenciaPendiente(p) === "Atrasado");

      return Math.round(res.reduce((a, b) => a + b, 0) / res.length) + " d";

    container.appendChild(metricas([
      ["Abiertos", abiertos.length, "neutral"],
      ["Atrasados", atrasados.length, "bad"],

        ultimaGestion: (p.gestiones && p.gestiones.length) ? U.fmtDate(p.gestiones[p.gestiones.length - 1].fecha) : "",
        completado: p.fechaCompletado || "",
      };
    });
    // Orden por urgencia por defecto
    rows.sort((a, b) => (URGENCIA_ORDEN[a.urgencia] - URGENCIA_ORDEN[b.urgencia]) || (a.atraso < b.atraso ? 1 : -1));

      { key: "equipo", label: "Equipo" },
      { key: "serie", label: "Serie" },

      { key: "espera", label: "En espera de", defaultVisible: false },

      columns: cols, rows, storageKey: "pendientes", exportName: "Pendientes_MP2026",

          promptMotivo((motivo) => { Store.marcarEnEspera(p.id, motivo); MP.app.render(); });

    function toggleExpand(p, dt) {
      // Abre un modal de gestión en línea (equivalente a desplegar la fila).
      const eq = Store.equipoByKey(p.equipoKey) || {};

      const mm = UI.modal({ title: "Pendiente · " + (eq.equipo || "") + " · " + p.tipo, size: "lg", body });

        // Footer acciones
        body.appendChild(el("div", { class: "modal-foot inline" }, [
          UI.btn("Editar pendiente", "ghost", () => { mm.close(); MP.forms.pendiente(p.equipoKey, () => MP.app.render(), p); }),
          !p.fechaCompletado ? UI.btn("✓ Completar", "primary", () => {
            const abiertas = (p.tareas || []).filter((t) => !t.hecha).length;
            const done = () => { Store.completarPendiente(p.id); mm.close(); MP.app.render(); };
            if (abiertas > 0) UI.confirm("Quedan <b>" + abiertas + "</b> tarea(s) sin marcar. ¿Completar igual?", done);
            else done();

          UI.btn("Eliminar", "danger ghost", () => UI.confirm("¿Eliminar este pendiente?", () => { Store.eliminarPendiente(p.id); mm.close(); MP.app.render(); }, { danger: true, okText: "Eliminar" })),

      const ta = el("textarea", { class: "ctrl", rows: 2, placeholder: "Motivo de la espera (de quién/qué se espera)…" });
      const mm = UI.modal({ title: "Marcar en espera", size: "sm", body: ta, footer: [

        UI.btn("Confirmar", "primary", () => { mm.close(); cb(ta.value.trim() || "Sin especificar"); }),
      ] });
    }
  };

  function chipUrg(urg) {
    const cls = urg === "Atrasado" ? "bad" : urg === "Hoy" ? "warn" : urg === "Completado" ? "ok" : urg === "En espera" ? "neutral" : "info";
    return el("span", { class: "chip " + cls }, urg);

 * ========================================================================= */
(function (global) {

      el("p", { class: "view-sub" }, "El último estado vale más que el detalle: equipos que requieren atención, ordenados por criticidad."),
    ]));

    const items = [];
    Store.equipos().forEach((eq) => {
      const key = U.equipoKey(eq);
      const est = Store.estadoEquipo(key);
      const exps = Store.expedientesDe(key);
      const expAbierto = exps.find((x) => x.estadoEvento !== "Cerrado");
      // Marcado FS/NU en planilla sin resolución posterior
      const eventos = Store.eventosEstado(key);
      const ultimo = eventos[eventos.length - 1];
      const fsNuPlanilla = ultimo && ultimo.origen === "Planilla" &&
        (ultimo.detalle.indexOf("Fuera de Servicio") >= 0 || ultimo.detalle.indexOf("No Ubicable") >= 0);

      const requiere = est.estado === C.ESTADO.NO_OPERATIVO ||
        est.estado === C.ESTADO.SERVICIO_TECNICO || !!expAbierto || fsNuPlanilla;
      if (!requiere) return;

      // Criticidad
      let crit = 3;
      if (est.estado === C.ESTADO.NO_OPERATIVO) crit = 1;
      else if (est.estado === C.ESTADO.SERVICIO_TECNICO) crit = 2;
      if (eq.clasificacion && /crítico/i.test(eq.clasificacion)) crit -= 0.5;

      items.push({
        eq, key, est, expAbierto, fsNuPlanilla, crit,
        ultimaGestion: ultimaGestionDe(key),
      });
    });

    items.sort((a, b) => (a.crit - b.crit) || ((b.est.dias || 0) - (a.est.dias || 0)));

    // Métricas
    container.appendChild(MP.views._metricas([
      ["Requieren atención", items.length, "neutral"],
      ["No Operativos", items.filter((i) => i.est.estado === C.ESTADO.NO_OPERATIVO).length, "bad"],
      ["En Servicio Técnico", items.filter((i) => i.est.estado === C.ESTADO.SERVICIO_TECNICO).length, "warn"],
      ["Expedientes abiertos", items.filter((i) => i.expAbierto).length, "info"],
    ]));

    if (items.length === 0) {
      container.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-ico" }, "✅"),
        el("h2", {}, "Todo operativo"),
        el("p", {}, "Ningún equipo requiere atención en este momento."),
      ]));
      return;
    }

    const list = el("div", { class: "oper-list" });
    items.forEach((it) => list.appendChild(card(it)));
    container.appendChild(list);

    function card(it) {
      const eq = it.eq;
      const c = el("div", { class: "oper-card crit-" + Math.ceil(it.crit) });
      c.appendChild(el("div", { class: "oper-main" }, [
        el("div", { class: "oper-title" }, [
          MP.views._chipEstado(it.est.estado),
          el("b", {}, " " + eq.equipo),
          el("span", { class: "muted" }, " · " + eq.servicio + " · " + (eq.serie || eq.nInventario)),
        ]),
        el("div", { class: "oper-sub muted" }, [
          it.est.dias !== null ? (it.est.dias + " días en estado") : "",
          it.expAbierto ? " · Folio " + it.expAbierto.folioSigem + " (" + Store.etapaExpediente(it.expAbierto) + ")" : "",
          it.fsNuPlanilla ? " · marcado en planilla sin resolución" : "",
          it.ultimaGestion ? " · Última gestión: " + it.ultimaGestion : "",
        ].filter(Boolean).join("")),
      ]));
      const acc = el("div", { class: "oper-actions" });
      // Registro en un clic
      if (it.expAbierto) {
        const x = it.expAbierto;
        const etapa = Store.etapaExpediente(x);
        let tipo = "evaluacion", label = "Registrar evaluación";
        if (etapa === C.ETAPAS_CORR.EN_ST) { tipo = "retorno_st"; label = "Registrar retorno"; }
        else if (etapa === C.ETAPAS_CORR.RETORNADO_OK || etapa === C.ETAPAS_CORR.EJECUCION) { tipo = "cierre"; label = "Cerrar"; }
        else if (etapa === C.ETAPAS_CORR.ESPERA) { tipo = "visita_ejecucion"; label = "Visita / Ejecución"; }
        acc.appendChild(UI.btn("▶ " + label, "primary sm", () => MP.forms.registrarAvance(x.id, tipo, () => MP.app.render())));
      } else {
        acc.appendChild(UI.btn("🔧 Abrir correctivo", "secondary sm", () => MP.forms.correctivo(it.key, () => MP.app.render())));
      }
      acc.appendChild(UI.btn("Ver ficha", "ghost sm", () => MP.views.detalle(it.key)));
      c.appendChild(acc);
      return c;
    }

    function ultimaGestionDe(key) {
      const upd = Store.ultimaActualizacion(key);
      return upd ? U.fmtDate(upd) : "";
    }
  };
})(window);

          marca: eq.marca, modelo: eq.modelo, serie: eq.serie,

      { key: "equipo", label: "Equipo" },
      { key: "tipo", label: "Tipo" },
      { key: "folio", label: "Folio SIGEM" },
      { key: "fechaDoc", label: "Fecha documento", render: (r) => el("span", {}, U.fmtDate(r.fechaDoc)), text: (r) => r.fechaDoc },
      { key: "tecnico", label: "Técnico" },
      { key: "empresa", label: "Empresa" },
      { key: "estado", label: "Estado / Etapa", render: (r) => el("span", { class: "chip " + (r._abierto ? "warn" : "ok") }, r.estado), text: (r) => r.estado },
      { key: "dias", label: "Días ciclo", align: "right", text: (r) => String(r.dias) },
      // columnas ocultas para búsqueda global por serie / inventario
      { key: "_serie", label: "Serie", defaultVisible: false },
      { key: "_inv", label: "N° Inventario", defaultVisible: false },
    ];

    const dt = MP.ui.DataTable({
      columns: cols, rows, storageKey: "correctivo", exportName: "Correctivo_MP2026",
      onRowClick: (r) => MP.views.detalle(r._key),
      rowClass: (r) => r._x.estadoEquipo === "No Operativo" && r._abierto ? "row-bad" : "",
      emptyText: "Sin expedientes correctivos.",
    });
    container.appendChild(dt.root);
  };
})(window);


/* ===== assets/js/views/datos.js ===== */
/* =========================================================================
 * MP 2026 · datos.js  —  Pasos 1 y 11
 * Importar planilla (PMP_2026 / Registro_MP-2026), descargar registros,
 * respaldo (backup) y restauración, datos de demostración.
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const el = U.el;
  const Store = MP.store;
  const UI = MP.ui;

  MP.views = MP.views || {};
  MP.views.datos = function (container) {
    container.appendChild(el("div", { class: "view-head" }, [
      el("h2", {}, "Datos y Respaldo"),
      el("p", { class: "view-sub" }, "Cargar la base de equipos, exportar registros y gestionar respaldos."),
    ]));

    const meta = Store.db.meta || {};
    const resumen = el("div", { class: "data-summary" }, [
      stat("Equipos", Store.db.equipos.length),
      stat("Mantenciones (app)", Store.db.mantenciones.length),
      stat("Pendientes", Store.db.pendientes.length),
      stat("Expedientes correctivos", Store.db.expedientes.length),
      stat("Última carga", meta.ultimaCarga ? U.fmtDate(meta.ultimaCarga) : "—"),
    ]);
    container.appendChild(resumen);

    const grid = el("div", { class: "cards-grid" });

    /* --- Importar planilla (Paso 1, 3, 4) --- */
    grid.appendChild(card("📥", "Cargar planilla de equipos",
      "Importa la base desde el archivo ProgramaciónMP2026 (hojas PMP_2026 y Registro_MP-2026). Encabezados en la fila 7, datos desde la fila 8. Serie y N° Inventario se conservan como texto.",
      [(() => {
        const inp = el("input", { type: "file", accept: ".xlsx,.xls", class: "hidden" });
        inp.addEventListener("change", () => {
          const f = inp.files[0]; if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const res = MP.excel.importarPlanilla(reader.result);
              UI.toast("Cargados " + res.equipos + " equipos" + (res.conRegistro ? " y " + res.registros + " registros." : "."), "ok");
              MP.app.go("equipos");
            } catch (e) { UI.toast("Error: " + e.message, "warn"); console.error(e); }
          };
          reader.readAsArrayBuffer(f);
          inp.value = "";
        });
        const btn = UI.btn("Seleccionar archivo .xlsx", "primary", () => {
          if (!MP.excel.disponible()) { UI.toast("SheetJS no disponible (sin conexión). Use respaldo JSON.", "warn"); return; }
          inp.click();
        });
        return el("div", {}, [btn, inp]);
      })()]));

    /* --- Datos de demostración --- */
    grid.appendChild(card("🧪", "Datos de demostración",
      "Carga un conjunto de equipos y registros de ejemplo que simulan escenarios reales (operativos, no operativos, en servicio técnico, pendientes atrasados y un expediente correctivo).",
      [UI.btn("Cargar demo", "secondary", () => {
        UI.confirm("Esto reemplazará los datos actuales por el conjunto de demostración. ¿Continuar?", () => {
          MP.seed(); UI.toast("Datos de demostración cargados.", "ok"); MP.app.go("equipos");
        });
      })]));

    /* --- Descargar todos los registros (Paso 11) --- */
    grid.appendChild(card("⬇️", "Descargar todos los registros",
      "Exporta equipos, mantenciones, pendientes y correctivo a un archivo Excel, conservando Serie y N° Inventario como texto con sus ceros a la izquierda.",
      [UI.btn("Descargar Excel", "secondary", () => MP.excel.descargarTodo())]));

    /* --- Backup (Paso 11) --- */
    grid.appendChild(card("💾", "Respaldo (backup)",
      "Genera un respaldo completo de los datos de la aplicación en formato JSON, que permite restaurar la información en caso de pérdida o reinstalación.",
      [
        UI.btn("Generar respaldo", "secondary", () => {
          const blob = new Blob([Store.exportBackup()], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = el("a", { href: url, download: "backup_MP2026_" + U.todayISO() + ".json" });
          document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
          UI.toast("Respaldo generado.", "ok");
        }),
        (() => {
          const inp = el("input", { type: "file", accept: ".json", class: "hidden" });
          inp.addEventListener("change", () => {
            const f = inp.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => {
              UI.confirm("Restaurar reemplazará todos los datos actuales. ¿Continuar?", () => {
                try { Store.importBackup(r.result); UI.toast("Respaldo restaurado.", "ok"); MP.app.go("equipos"); }
                catch (e) { UI.toast("Respaldo inválido: " + e.message, "warn"); }
              });
            };
            r.readAsText(f); inp.value = "";
          });
          const btn = UI.btn("Restaurar respaldo", "ghost", () => inp.click());
          return el("div", {}, [btn, inp]);
        })(),
      ]));

    /* --- Borrar todo --- */
    grid.appendChild(card("🗑️", "Reiniciar datos",
      "Elimina todos los datos almacenados en este navegador. Esta acción no se puede deshacer.",
      [UI.btn("Borrar todo", "danger ghost", () => {
        UI.confirm("¿Borrar <b>todos</b> los datos de la aplicación?", () => { Store.reset(); UI.toast("Datos borrados.", "ok"); MP.app.render(); }, { danger: true, okText: "Borrar todo" });
      })]));

    container.appendChild(grid);

    function stat(label, val) {
      return el("div", { class: "data-stat" }, [el("b", {}, String(val)), el("span", {}, label)]);
    }
    function card(ico, titulo, desc, acciones) {
      return el("div", { class: "data-card" }, [
        el("div", { class: "data-card-ico" }, ico),
        el("h3", {}, titulo),
        el("p", { class: "muted" }, desc),
        el("div", { class: "data-card-actions" }, acciones),
      ]);
    }
  };
})(window);


/* ===== assets/js/app.js ===== */
/* =========================================================================
 * MP 2026 · app.js  —  Enrutador, navegación e inicialización.
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const el = U.el;
  const Store = MP.store;
  const UI = MP.ui;

  const App = MP.app = {};
  App.vistaActual = "equipos";

  const NAV = [
    { id: "equipos", label: "Equipos", ico: "📊" },
    { id: "plan", label: "Plan de Mantenimiento", ico: "🗓️" },
    { id: "pendientes", label: "Pendientes", ico: "📋" },
    { id: "operatividad", label: "Operatividad", ico: "🚨" },
    { id: "correctivo", label: "Correctivo", ico: "🔧" },
    { id: "datos", label: "Datos", ico: "⚙️" },
  ];

  App.go = function (id) {
    App.vistaActual = id;
    if (MP.grabacion.activa()) MP.grabacion.notarVista(id);
    if (location.hash !== "#" + id) location.hash = id;
    App.render();
  };

  App.render = function () {
    // Nav activo
    document.querySelectorAll(".nav-item").forEach((n) =>
      n.classList.toggle("active", n.dataset.id === App.vistaActual));
    // Badge de pendientes
    const abiertos = Store.db.pendientes.filter((p) => !p.fechaCompletado).length;
    const badge = document.getElementById("pend-badge");
    if (badge) { badge.textContent = abiertos; badge.style.display = abiertos ? "" : "none"; }

    const main = document.getElementById("view");
    main.innerHTML = "";
    const fn = MP.views[App.vistaActual];
    if (fn) {
      try { fn(main); }
      catch (e) { console.error(e); main.appendChild(el("div", { class: "error-box" }, "Error al renderizar: " + e.message)); }
    }
  };

  function buildShell() {
    const app = document.getElementById("app");

    // Barra superior
    const grabBtn = el("button", { id: "grab-btn", class: "topbar-btn", title: "Grabar sesión (Paso 14)" }, [
      el("span", { class: "rec-dot" }), el("span", { id: "grab-label" }, "Grabar"),
    ]);
    grabBtn.addEventListener("click", () => {
      MP.grabacion.toggle();
      const on = MP.grabacion.activa();
      grabBtn.classList.toggle("recording", on);
      document.getElementById("grab-label").textContent = on ? "Detener" : "Grabar";
    });

    const topbar = el("header", { class: "topbar" }, [
      el("div", { class: "brand" }, [
        el("span", { class: "brand-logo" }, "✚"),
        el("div", {}, [
          el("div", { class: "brand-title" }, "Gestión MP 2026"),
          el("div", { class: "brand-sub" }, "Mantenciones Preventivas de Equipos"),
        ]),
      ]),
      el("div", { class: "topbar-actions" }, [
        grabBtn,
        el("button", { class: "topbar-btn", title: "Descargar registros", onclick: () => MP.excel.descargarTodo() }, "⬇ Exportar"),
        el("button", { class: "topbar-btn", title: "Respaldo y datos", onclick: () => App.go("datos") }, "⚙ Datos"),
      ]),
    ]);

    // Navegación lateral
    const nav = el("nav", { class: "sidebar" }, NAV.map((n) => {
      const item = el("a", { class: "nav-item", "data-id": n.id, href: "#" + n.id }, [
        el("span", { class: "nav-ico" }, n.ico),
        el("span", { class: "nav-label" }, n.label),
        n.id === "pendientes" ? el("span", { id: "pend-badge", class: "nav-badge" }, "0") : null,
      ]);
      item.addEventListener("click", (e) => { e.preventDefault(); App.go(n.id); });
      return item;
    }));

    const main = el("main", { class: "main" }, el("div", { id: "view", class: "view" }));

    app.appendChild(topbar);
    app.appendChild(el("div", { class: "layout" }, [nav, main]));
  }

  App.init = function () {
    buildShell();
    const cargado = Store.load();
    if (!cargado || Store.db.equipos.length === 0) {
      // Primera vez: cargar demo para que el usuario vea el sistema funcionando.
      MP.seed();
    }
    // Aviso de pendientes atrasados al abrir (Paso 9).
    const atrasados = Store.db.pendientes.filter((p) => !p.fechaCompletado && MP.store.urgenciaPendiente(p) === "Atrasado");
    if (atrasados.length) setTimeout(() => UI.toast("⚠️ Tiene " + atrasados.length + " pendiente(s) atrasado(s).", "warn"), 800);

    Store.onChange(() => App.render());

    const hash = (location.hash || "").replace("#", "");
    App.vistaActual = NAV.some((n) => n.id === hash) ? hash : "equipos";
    window.addEventListener("hashchange", () => {
      const h = (location.hash || "").replace("#", "");
      if (NAV.some((n) => n.id === h) && h !== App.vistaActual) { App.vistaActual = h; App.render(); }
    });

    App.render();
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", App.init);
  else App.init();

})(window);

</script>
</body>
</html>
