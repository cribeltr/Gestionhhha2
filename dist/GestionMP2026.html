<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestión MP 2026 · Mantenciones Preventivas de Equipos</title>
<meta name="description" content="Sistema de Gestión de Mantenciones Preventivas y Correctivas de Equipos — MP 2026. Archivo único autónomo." />
<style>
/* =========================================================================
 * MP 2026 · styles.css — Identidad visual clínica/hospitalaria.
 * ========================================================================= */
:root {
  --azul: #0d6efd;        --azul-d: #0a58ca;       --azul-l: #e7f1ff;
  --teal: #0b8a8f;        --teal-d: #096e72;       --teal-l: #e3f6f6;
  --verde: #1a9c5b;       --verde-l: #e4f6ec;
  --amber: #d98300;       --amber-l: #fff3e0;
  --rojo: #d6336c;        --rojo2: #c92a2a;        --rojo-l: #fce8ee;
  --gris-0: #ffffff;      --gris-1: #f6f8fb;       --gris-2: #eef2f7;
  --gris-3: #dde4ee;      --gris-4: #aab4c4;       --gris-5: #6b7585;
  --tinta: #1c2533;       --tinta-2: #38445a;
  --sombra: 0 1px 2px rgba(16,30,54,.06), 0 2px 8px rgba(16,30,54,.08);
  --sombra-lg: 0 8px 30px rgba(16,30,54,.18);
  --radio: 10px;          --radio-sm: 7px;
  --topbar-h: 60px;       --side-w: 232px;
  --ff: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--ff); color: var(--tinta); background: var(--gris-1); font-size: 14px; line-height: 1.45; }
h2, h3, h4 { margin: 0 0 .3em; color: var(--tinta); }
a { color: var(--azul); text-decoration: none; }
.muted { color: var(--gris-5); }
.hidden { display: none !important; }
.ta-right { text-align: right; }
.ta-center { text-align: center; }

/* ---------- Layout ---------- */
.topbar {
  height: var(--topbar-h); background: linear-gradient(100deg, var(--teal-d), var(--teal));
  color: #fff; display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; position: sticky; top: 0; z-index: 40; box-shadow: var(--sombra);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo { width: 38px; height: 38px; border-radius: 9px; background: rgba(255,255,255,.18);
  display: grid; place-items: center; font-size: 22px; font-weight: 700; }
.brand-title { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.brand-sub { font-size: 11.5px; opacity: .85; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.topbar-btn { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.22);
  padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 7px; }
.topbar-btn:hover { background: rgba(255,255,255,.26); }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 0 0 rgba(255,107,107,.6); }
#grab-btn.recording { background: var(--rojo2); border-color: var(--rojo2); }
#grab-btn.recording .rec-dot { animation: pulse 1.2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,107,107,.6);} 70%{box-shadow:0 0 0 7px rgba(255,107,107,0);} 100%{box-shadow:0 0 0 0 rgba(255,107,107,0);} }

.layout { display: flex; align-items: stretch; min-height: calc(100vh - var(--topbar-h)); }
.sidebar { width: var(--side-w); background: var(--gris-0); border-right: 1px solid var(--gris-3);
  padding: 12px 10px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); flex: 0 0 auto; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px;
  color: var(--tinta-2); font-weight: 500; margin-bottom: 3px; cursor: pointer; position: relative; }
.nav-item:hover { background: var(--gris-2); }
.nav-item.active { background: var(--teal-l); color: var(--teal-d); font-weight: 600; }
.nav-ico { font-size: 17px; width: 22px; text-align: center; }
.nav-badge { margin-left: auto; background: var(--rojo); color: #fff; border-radius: 11px;
  font-size: 11px; padding: 1px 7px; font-weight: 700; }
.main { flex: 1 1 auto; min-width: 0; padding: 20px 22px 40px; }
.view-head { margin-bottom: 14px; }
.view-head h2 { font-size: 20px; }
.view-sub { color: var(--gris-5); margin: 0; font-size: 13px; }

/* ---------- Botones ---------- */
.btn { font-family: var(--ff); border: 1px solid transparent; border-radius: 8px; padding: 8px 14px;
  font-size: 13.5px; cursor: pointer; background: var(--gris-2); color: var(--tinta); font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; transition: .12s; }
.btn:hover { filter: brightness(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--azul); color: #fff; border-color: var(--azul); }
.btn.primary:hover { background: var(--azul-d); }
.btn.secondary { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn.secondary:hover { background: var(--teal-d); }
.btn.ghost { background: #fff; border-color: var(--gris-3); color: var(--tinta-2); }
.btn.ghost:hover { background: var(--gris-1); }
.btn.danger { background: var(--rojo2); color: #fff; border-color: var(--rojo2); }
.btn.danger.ghost { background: #fff; color: var(--rojo2); border-color: var(--rojo-l); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.chip { background: var(--azul-l); color: var(--azul-d); border-color: transparent; padding: 4px 11px; border-radius: 20px; font-size: 12.5px; }
.icon-btn { border: 1px solid var(--gris-3); background: #fff; border-radius: 7px; min-width: 30px; height: 28px;
  padding: 0 7px; cursor: pointer; font-size: 13px; color: var(--tinta-2); }
.icon-btn:hover { background: var(--gris-2); }

/* ---------- Chips / pills / tags ---------- */
.chip { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.ok, .estado-ok { background: var(--verde-l); color: var(--verde); }
.chip.bad, .estado-bad { background: var(--rojo-l); color: var(--rojo2); }
.chip.warn, .estado-warn { background: var(--amber-l); color: var(--amber); }
.chip.info { background: var(--azul-l); color: var(--azul-d); }
.chip.neutral { background: var(--gris-2); color: var(--gris-5); }
.code-pill { display: inline-block; min-width: 26px; text-align: center; padding: 2px 7px; border-radius: 6px;
  background: var(--azul-l); color: var(--azul-d); font-weight: 700; font-size: 12px; }
.code-pill.res { background: var(--teal-l); color: var(--teal-d); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 700; }
.tag-official { background: var(--verde-l); color: var(--verde); }
.tag-draft { background: var(--amber-l); color: var(--amber); }

/* ---------- DataTable ---------- */
.dt { background: #fff; border: 1px solid var(--gris-3); border-radius: var(--radio); box-shadow: var(--sombra); overflow: hidden; }
.dt-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--gris-2); flex-wrap: wrap; }
.dt-search { flex: 0 1 280px; padding: 7px 11px; border: 1px solid var(--gris-3); border-radius: 8px; font-size: 13px; }
.dt-count { font-size: 12.5px; color: var(--gris-5); }
.dt-spacer { flex: 1 1 auto; }
.dt-scroll { overflow: auto; max-height: calc(100vh - 280px); }
.dt-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.dt-table thead th { position: sticky; top: 0; background: var(--gris-2); z-index: 2; text-align: left;
  padding: 0; border-bottom: 2px solid var(--gris-3); white-space: nowrap; }
.dt-grouprow th { background: var(--teal-l); color: var(--teal-d); text-align: center; padding: 5px 8px;
  border-bottom: 1px solid var(--gris-3); font-size: 12px; font-weight: 700; }
.dt-grouprow th.dt-group { border-left: 1px solid var(--gris-3); }
.th-inner { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 9px 10px; }
.th-label { font-weight: 700; color: var(--tinta-2); font-size: 12.5px; }
.th-filter { border: none; background: transparent; cursor: pointer; color: var(--gris-4); font-size: 11px; padding: 2px 4px; border-radius: 5px; }
.th-filter:hover { background: var(--gris-3); color: var(--tinta); }
.th-filter.active { color: var(--azul); background: var(--azul-l); }
.dt-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--gris-2); vertical-align: middle; }
.dt-table tbody tr:hover { background: var(--gris-1); }
.dt-table tbody tr.clickable { cursor: pointer; }
.dt-table tbody tr.row-bad { background: #fdf1f4; }
.dt-table tbody tr.row-bad:hover { background: #fbe7ec; }
.dt-table tbody tr.row-warn { background: #fff7ea; }
.dt-table tbody tr.urg-row-atrasado { background: #fdf1f4; }
.dt-table tbody tr.urg-row-hoy { background: #fff7ea; }
.dt-table tbody tr.urg-row-completado { color: var(--gris-5); }
.dt-empty { text-align: center; color: var(--gris-5); padding: 30px; }
.dt-pag { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-top: 1px solid var(--gris-2); }
.dt-pageinfo { font-size: 12.5px; color: var(--gris-5); }
.dt-pagesize { margin-left: auto; padding: 5px 8px; border: 1px solid var(--gris-3); border-radius: 7px; font-size: 12.5px; }
.row-actions { display: flex; gap: 3px; }

/* ---------- Popover de filtro ---------- */
.dt-pop { background: #fff; border: 1px solid var(--gris-3); border-radius: var(--radio-sm); box-shadow: var(--sombra-lg);
  width: 250px; z-index: 100; padding: 8px; }
.dt-pop-title { font-weight: 700; font-size: 12.5px; padding: 2px 4px 6px; color: var(--tinta-2); }
.dt-pop-sort { display: flex; gap: 5px; margin-bottom: 6px; }
.dt-pop-sort .btn { flex: 1; justify-content: center; }
.dt-pop-search { width: 100%; padding: 6px 9px; border: 1px solid var(--gris-3); border-radius: 7px; font-size: 12.5px; margin-bottom: 6px; }
.dt-pop-list { max-height: 200px; overflow: auto; border: 1px solid var(--gris-2); border-radius: 7px; padding: 4px; }
.dt-pop-item { display: flex; align-items: center; gap: 7px; padding: 4px 6px; font-size: 12.5px; border-radius: 5px; cursor: pointer; }
.dt-pop-item:hover { background: var(--gris-1); }
.dt-pop-item.all { border-bottom: 1px solid var(--gris-2); font-weight: 600; margin-bottom: 2px; }
.dt-pop-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dt-pop-foot { display: flex; gap: 6px; margin-top: 7px; }
.dt-pop-foot .btn { flex: 1; justify-content: center; }

/* ---------- Métricas ---------- */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.metric { background: #fff; border: 1px solid var(--gris-3); border-left: 4px solid var(--gris-4);
  border-radius: var(--radio); padding: 12px 14px; box-shadow: var(--sombra); }
.metric-val { font-size: 24px; font-weight: 800; line-height: 1.1; color: var(--tinta); }
.metric-label { font-size: 12px; color: var(--gris-5); margin-top: 2px; }
.metric-bad { border-left-color: var(--rojo2); } .metric-bad .metric-val { color: var(--rojo2); }
.metric-warn { border-left-color: var(--amber); } .metric-warn .metric-val { color: var(--amber); }
.metric-ok { border-left-color: var(--verde); } .metric-ok .metric-val { color: var(--verde); }
.metric-info { border-left-color: var(--azul); } .metric-info .metric-val { color: var(--azul); }
.metric-neutral { border-left-color: var(--teal); }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(16,24,40,.5); z-index: 80; display: flex;
  align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; backdrop-filter: blur(2px); }
.modal-box { background: #fff; border-radius: 14px; box-shadow: var(--sombra-lg); width: 100%; max-width: 640px;
  animation: pop .16s ease; }
.modal-box.sm { max-width: 420px; } .modal-box.md { max-width: 620px; }
.modal-box.lg { max-width: 820px; } .modal-box.xl { max-width: 1040px; }
@keyframes pop { from { transform: translateY(8px) scale(.99); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
  border-bottom: 1px solid var(--gris-2); }
.modal-head h3 { font-size: 16px; margin: 0; }
.modal-x { border: none; background: var(--gris-2); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--gris-5); }
.modal-x:hover { background: var(--gris-3); }
.modal-body { padding: 18px 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px; border-top: 1px solid var(--gris-2); }
.modal-foot.inline { border-top: 1px solid var(--gris-2); margin-top: 16px; padding: 14px 0 0; }
.confirm-msg { font-size: 14px; }

/* ---------- Formularios ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 16px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full, .form-grid > .field-hint, .form-grid > .subform, .form-grid > .subform-title { grid-column: 1 / -1; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.field-hint { font-size: 12px; color: var(--gris-5); background: var(--gris-1); padding: 7px 10px; border-radius: 7px; }
.ctrl { width: 100%; padding: 8px 11px; border: 1px solid var(--gris-3); border-radius: 8px; font-size: 13.5px; font-family: var(--ff); background: #fff; }
.ctrl:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-l); }
textarea.ctrl { resize: vertical; }
.segmented { display: inline-flex; border: 1px solid var(--gris-3); border-radius: 8px; overflow: hidden; }
.seg { border: none; background: #fff; padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--tinta-2); border-right: 1px solid var(--gris-3); }
.seg:last-child { border-right: none; }
.seg.active { background: var(--azul); color: #fff; font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.quick-dates { display: flex; gap: 6px; margin-top: 6px; }
.subform { background: var(--gris-1); border: 1px dashed var(--gris-3); border-radius: 9px; padding: 12px; }
.subform-title { font-weight: 700; font-size: 13px; color: var(--teal-d); margin-top: 4px; }
.readonly-val { padding: 8px 11px; background: var(--gris-1); border-radius: 8px; font-size: 13.5px; }
.tareas-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
.tarea-row { display: flex; align-items: center; gap: 8px; }
.tarea-txt.done { text-decoration: line-through; color: var(--gris-5); }
.add-tarea { display: flex; gap: 6px; }
.add-tarea .ctrl { flex: 1; }

/* ---------- Detalle de equipo ---------- */
.detalle-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
.detalle-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--gris-5);
  border-bottom: 1px solid var(--gris-2); padding-bottom: 5px; margin: 20px 0 11px; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.kv { background: var(--gris-1); border: 1px solid var(--gris-2); border-radius: 8px; padding: 7px 11px; cursor: pointer; transition: .12s; }
.kv:hover { border-color: var(--azul); background: var(--azul-l); }
.kv.copied { border-color: var(--verde); background: var(--verde-l); }
.kv-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--gris-5); }
.kv-value { font-size: 13.5px; font-weight: 600; color: var(--tinta); word-break: break-word; }
.mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini-table th { text-align: left; background: var(--gris-2); padding: 7px 9px; font-size: 12px; color: var(--tinta-2); }
.mini-table td { padding: 7px 9px; border-bottom: 1px solid var(--gris-2); vertical-align: top; }
.mant-app { font-size: 12.5px; margin-bottom: 3px; }
.pend-mini-list { display: flex; flex-direction: column; gap: 8px; }
.pend-mini { display: flex; justify-content: space-between; gap: 10px; align-items: center;
  background: var(--gris-1); border: 1px solid var(--gris-2); border-radius: 9px; padding: 9px 12px; }
.pend-mini-actions { display: flex; gap: 6px; flex: 0 0 auto; }

/* ---------- Expediente correctivo ---------- */
.exp-card { border: 1px solid var(--gris-3); border-radius: var(--radio); padding: 14px; margin-bottom: 12px; background: #fff; }
.exp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.exp-head .chip { margin-left: 7px; }
.exp-req { font-style: italic; margin: 6px 0; }
.exp-quick { background: var(--azul-l); border-radius: 8px; padding: 9px 12px; margin: 10px 0; font-size: 13px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.exp-foot { display: flex; gap: 8px; margin-top: 10px; }
.timeline { border-left: 2px solid var(--gris-3); margin: 8px 0 4px 8px; padding-left: 0; }
.tl-item { position: relative; padding: 5px 0 12px 20px; }
.tl-dot { position: absolute; left: -7px; top: 8px; width: 11px; height: 11px; border-radius: 50%; background: var(--teal); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--gris-3); }
.tl-title { font-size: 13px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.tl-date { color: var(--azul-d); font-weight: 600; font-size: 12.5px; }
.tl-corr { color: var(--amber); font-size: 11.5px; }
.tl-det { font-size: 12.5px; margin-top: 2px; }
.tl-reg { font-size: 11px; color: var(--gris-4); }
.tl-del { min-width: 22px; height: 22px; padding: 0; margin-left: auto; }

/* ---------- Operatividad ---------- */
.oper-list { display: flex; flex-direction: column; gap: 10px; }
.oper-card { display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: #fff; border: 1px solid var(--gris-3); border-left: 5px solid var(--gris-4);
  border-radius: var(--radio); padding: 13px 16px; box-shadow: var(--sombra); flex-wrap: wrap; }
.oper-card.crit-1 { border-left-color: var(--rojo2); }
.oper-card.crit-2 { border-left-color: var(--amber); }
.oper-card.crit-3 { border-left-color: var(--azul); }
.oper-title { font-size: 14px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.oper-sub { font-size: 12.5px; margin-top: 3px; }
.oper-actions { display: flex; gap: 7px; flex: 0 0 auto; }

/* ---------- Bitácora / gestión ---------- */
.bitacora { display: flex; flex-direction: column; gap: 5px; }
.bit-item { font-size: 12.5px; background: var(--gris-1); border-radius: 7px; padding: 6px 10px; }
.bit-date { font-weight: 700; color: var(--teal-d); margin-right: 6px; }
.gestion-box { display: flex; gap: 7px; align-items: flex-start; margin-top: 8px; }
.gestion-box .ctrl { flex: 1; }

/* ---------- Datos ---------- */
.data-summary { display: flex; gap: 22px; flex-wrap: wrap; background: #fff; border: 1px solid var(--gris-3);
  border-radius: var(--radio); padding: 14px 18px; margin-bottom: 16px; box-shadow: var(--sombra); }
.data-stat { display: flex; flex-direction: column; }
.data-stat b { font-size: 21px; } .data-stat span { font-size: 12px; color: var(--gris-5); }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.data-card { background: #fff; border: 1px solid var(--gris-3); border-radius: var(--radio); padding: 16px; box-shadow: var(--sombra); }
.data-card-ico { font-size: 26px; } .data-card h3 { font-size: 15px; margin: 6px 0; }
.data-card p { font-size: 12.5px; margin: 0 0 12px; }
.data-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Estados varios ---------- */
.empty-state { text-align: center; padding: 60px 20px; color: var(--gris-5); }
.empty-ico { font-size: 46px; margin-bottom: 8px; }
.empty-state h2 { color: var(--tinta-2); }
.empty-state p { max-width: 460px; margin: 6px auto 16px; }
.error-box { background: var(--rojo-l); color: var(--rojo2); padding: 12px 16px; border-radius: 9px; }

/* ---------- Toasts ---------- */
.toast-cont { position: fixed; bottom: 18px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--tinta); color: #fff; padding: 11px 16px; border-radius: 9px; font-size: 13px;
  box-shadow: var(--sombra-lg); opacity: 0; transform: translateX(20px); transition: .25s; max-width: 340px; }
.toast.show { opacity: 1; transform: none; }
.toast-ok { background: var(--verde); } .toast-warn { background: var(--amber); } .toast-info { background: var(--azul-d); }

/* ---------- Responsive ---------- */
@media (max-width: 820px) {

    display: flex; gap: 4px; overflow-x: auto; border-top: 1px solid var(--gris-3); z-index: 50; padding: 6px; }

  /* ----- Códigos de Programación (Paso 3) ----------------------------- */

  const RESULTADO_VALIDOS = [

    "Si-RA", "FS", "No", "NU", "Baja",
  ];

  /* ----- Causales de reprogramación (Paso 6) -------------------------- */
  const CAUSALES = {

  // C2,C3,C4 -> sin nueva fecha (se registra en el mes real de ejecución).

  const CAUSALES_REPROGRAMA_30 = ["C1", "C5", "C6", "C7", "C8"];
  const CAUSALES_SIN_FECHA = ["C2", "C3", "C4"];

  /* ----- Ejecutores (Paso 8) ------------------------------------------ */
  const EJECUTORES = [
    "Carlos Bahamondes Seguel",
    "Cristián Beltrán Oviedo",
    "Cristina Rozas Urrutia",
    "Daniel Díaz Neira",
    "Ignacio Berner Bergara",
    "Macarena Toledo",
    "Marco Ulloa",
    "Matías Soazo Garrido",
    "Ricardo Matus Aroca",
    "Tito Millapán Riquelme",
    "Personal Externo",
  ];

  /* ----- Tipos de pendiente (Paso 9) ---------------------------------- */
  const TIPOS_PENDIENTE = [
    "Reprogramación Mantención Preventiva",
    "Protocolo Interno de Mantenimiento",
    "Protocolo Externo de Mantenimiento",
    "Pauta de Monitoreo Diario",
    "Imprimir Documento",
    "Otro",
  ];

  /* ----- Mantenimiento correctivo (Paso 10) --------------------------- */
  const TIPOS_EVENTO = ["Orden de Trabajo", "Reporte de Servicio"];
  const ESTADOS_EQUIPO_CORR = ["Operativo", "No Operativo", "Servicio Técnico"];
  const TIPOS_COMPRA = ["Trato Directo", "Compra Ágil"];
  const EMPRESAS = [
    "Medtronic Chile",

    "Philips Healthcare",
    "GE HealthCare",

    "Servicio Técnico Biomédico Regional",
    "Equipos Médicos del Sur SpA",
  ];

  /* ----- Etapas del expediente correctivo (Paso 10 — flujo OT) -------- */
  const ETAPAS_CORR = {
    APERTURA: "Apertura",
    EVALUACION: "Evaluación técnica",
    COMPRA: "Gestión de compra",
    ESPERA: "Espera y recepción",
    EN_ST: "En servicio técnico externo · esperando retorno",
    RETORNADO_OK: "Retornado · por cerrar",
    RETORNADO_NOK: "Retornado sin reparar · evaluar",
    EJECUCION: "Ejecución",
    CERRADO: "Cerrado",
  };

  /* ----- Estados de equipo (Paso 2 / 12) ------------------------------ */
  const ESTADO = {
    OPERATIVO: "Operativo",
    NO_OPERATIVO: "No Operativo",
    SERVICIO_TECNICO: "Servicio Técnico",
  };

  MP.const = {
    MESES, PROGRAMA, PROGRAMA_VALIDOS, RESULTADO, RESULTADO_VALIDOS,
    CAUSALES, CAUSALES_REPROGRAMA_30, CAUSALES_SIN_FECHA,
    EJECUTORES, TIPOS_PENDIENTE, TIPOS_EVENTO, ESTADOS_EQUIPO_CORR,
    TIPOS_COMPRA, EMPRESAS, ETAPAS_CORR, ESTADO,
  };

  /* =====================================================================
   * Utilidades
   * =================================================================== */
  const U = MP.util = {};

  U.uid = function (prefix) {
    return (prefix || "id") + "_" + Date.now().toString(36) + "_" +
      Math.random().toString(36).slice(2, 8);
  };

  // Lee un valor conservando ceros a la izquierda (Serie / N° Inventario).
  U.asText = function (v) {
    if (v === null || v === undefined) return "";
    return String(v).trim();
  };

  U.todayISO = function () {
    const d = new Date();
    return U.dateToISO(d);
  };

  U.dateToISO = function (d) {
    if (!d) return "";
    if (typeof d === "string") return d.slice(0, 10);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };

  U.parseISO = function (s) {
    if (!s) return null;
    const parts = String(s).slice(0, 10).split("-");
    if (parts.length !== 3) return null;
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  };

  U.fmtDate = function (s) {
    const d = U.parseISO(s);
    if (!d || isNaN(d)) return "";
    return String(d.getDate()).padStart(2, "0") + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" + d.getFullYear();
  };

  U.daysBetween = function (aISO, bISO) {
    const a = U.parseISO(aISO), b = U.parseISO(bISO || U.todayISO());
    if (!a || !b) return null;
    return Math.round((b - a) / 86400000);
  };

  U.addDays = function (iso, n) {
    const d = U.parseISO(iso) || new Date();
    d.setDate(d.getDate() + n);
    return U.dateToISO(d);
  };

  U.mesKeyFromISO = function (iso) {
    const d = U.parseISO(iso);
    if (!d) return null;
    return MESES[d.getMonth()].key;
  };

  U.mesNombre = function (key) {
    const m = MESES.find((x) => x.key === key);
    return m ? m.nombre : key;
  };

  U.lastDayOfMonthISO = function (year, monthNum) {
    const d = new Date(year, monthNum, 0);
    return U.dateToISO(d);
  };

  // Escapa HTML para inyección segura en innerHTML.
  U.esc = function (s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };

  // Crea un elemento DOM con atributos e hijos.
  U.el = function (tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === "class") node.className = attrs[k];
        else if (k === "html") node.innerHTML = attrs[k];
        else if (k === "text") node.textContent = attrs[k];
        else if (k.startsWith("on") && typeof attrs[k] === "function") {
          node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        } else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) {
          node.setAttribute(k, attrs[k]);
        }
      }
    }
    if (children !== null && children !== undefined) {
      (Array.isArray(children) ? children : [children]).forEach((c) => {
        if (c === null || c === undefined || c === false) return;
        node.appendChild(typeof c === "string" || typeof c === "number"
          ? document.createTextNode(String(c)) : c);
      });
    }
    return node;
  };

  // Clave única de equipo: Serie o, en su defecto, N° Inventario (Paso 1).
  U.equipoKey = function (eq) {
    if (!eq) return "";
    const serie = U.asText(eq.serie);
    if (serie) return "S:" + serie;
    const inv = U.asText(eq.nInventario);
    if (inv) return "I:" + inv;
    return "ID:" + U.asText(eq.id);
  };

  // Normaliza texto para búsqueda (sin acentos, minúsculas).
  U.norm = function (s) {
    return U.asText(s).toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");
  };

})(window);


/* ===== assets/js/core/store.js ===== */
/* =========================================================================
 * MP 2026 · store.js
 * Capa de datos: estado en memoria, persistencia en localStorage,
 * y derivaciones (estado del equipo, etapas de expediente, pendientes).
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const C = MP.const;

  const KEY = "mp2026_db_v1";

  const DB = {
    equipos: [],          // Paso 1
    mantenciones: [],     // Paso 8 (registradas en la app)
    pendientes: [],       // Paso 9
    expedientes: [],      // Paso 10 / 15 (correctivo)
    meta: { creado: null, ultimaCarga: null },
  };

  const Store = MP.store = {};
  const listeners = [];

  Store.db = DB;

  Store.onChange = function (fn) { listeners.push(fn); };
  Store.emit = function () { listeners.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); };

  /* ----- Persistencia ------------------------------------------------- */
  Store.save = function () {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        equipos: DB.equipos, mantenciones: DB.mantenciones,
        pendientes: DB.pendientes, expedientes: DB.expedientes, meta: DB.meta,
      }));
    } catch (e) { console.error("No se pudo guardar", e); }
  };

  Store.load = function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      DB.equipos = data.equipos || [];
      DB.mantenciones = data.mantenciones || [];
      DB.pendientes = data.pendientes || [];
      DB.expedientes = data.expedientes || [];
      DB.meta = data.meta || { creado: null, ultimaCarga: null };
      return true;
    } catch (e) { console.error("No se pudo cargar", e); return false; }
  };

  Store.commit = function () { Store.save(); Store.emit(); };

  Store.reset = function () {
    DB.equipos = []; DB.mantenciones = []; DB.pendientes = []; DB.expedientes = [];
    DB.meta = { creado: new Date().toISOString(), ultimaCarga: null };
    Store.commit();
  };

  /* ----- Backup / Restauración (Paso 11) ------------------------------ */
  Store.exportBackup = function () {
    return JSON.stringify({
      _app: "MP2026", _version: 1, _fecha: new Date().toISOString(),
      equipos: DB.equipos, mantenciones: DB.mantenciones,
      pendientes: DB.pendientes, expedientes: DB.expedientes, meta: DB.meta,
    }, null, 2);
  };

  Store.importBackup = function (json) {
    const data = typeof json === "string" ? JSON.parse(json) : json;
    if (!data || !Array.isArray(data.equipos)) throw new Error("Respaldo inválido");
    DB.equipos = data.equipos || [];
    DB.mantenciones = data.mantenciones || [];
    DB.pendientes = data.pendientes || [];
    DB.expedientes = data.expedientes || [];
    DB.meta = data.meta || { creado: null, ultimaCarga: null };
    Store.commit();
  };

  /* ----- Accesores ---------------------------------------------------- */
  Store.equipos = function () { return DB.equipos; };

  Store.equipoByKey = function (key) {
    return DB.equipos.find((e) => U.equipoKey(e) === key) || null;
  };

  Store.mantencionesDe = function (key) {
    return DB.mantenciones.filter((m) => m.equipoKey === key);
  };

  Store.pendientesDe = function (key) {
    return DB.pendientes.filter((p) => p.equipoKey === key);
  };

  Store.expedientesDe = function (key) {
    return DB.expedientes.filter((x) => x.equipoKey === key);
  };

  /* =====================================================================
   * Mantenciones preventivas (Paso 8)
   * =================================================================== */
  Store.guardarMantencion = function (m) {
    if (!m.id) {
      m.id = U.uid("mant");
      m.createdAt = new Date().toISOString();
      DB.mantenciones.push(m);
    } else {
      const i = DB.mantenciones.findIndex((x) => x.id === m.id);
      if (i >= 0) DB.mantenciones[i] = Object.assign(DB.mantenciones[i], m);
      else DB.mantenciones.push(m);
    }
    // Generación automática de pendiente (Paso 8: Gestión pendiente Sí).
    if (m.gestionPendiente && !m._pendienteGenerado) {
      Store._generarPendienteDeMantencion(m);
      m._pendienteGenerado = true;
    }
    Store.commit();
    return m;
  };

  Store._generarPendienteDeMantencion = function (m) {
    const esCausal = /^C[1-8]$/.test(m.resultado || "");
    const tipo = esCausal ? "Reprogramación Mantención Preventiva" : "Otro";
    const reprograma30 = C.CAUSALES_REPROGRAMA_30.includes(m.resultado);
    const fechaCompromiso = reprograma30 ? U.addDays(m.fecha || U.todayISO(), 30)
      : U.addDays(U.todayISO(), 7);
    Store.crearPendiente({
      equipoKey: m.equipoKey,
      tipo,
      descripcion: esCausal
        ? "Generado automáticamente desde mantención preventiva (" + m.resultado + "): " +
          (C.CAUSALES[m.resultado] || "")
        : "Generado automáticamente desde mantención preventiva.",
      fechaCompromiso,
      origen: "preventivo",
      vinculoMantencionId: m.id,
    });
  };

  Store.eliminarMantencion = function (id) {
    DB.mantenciones = DB.mantenciones.filter((m) => m.id !== id);
    Store.commit();
  };

  /* =====================================================================
   * Pendientes (Paso 9)
   * =================================================================== */
  Store.crearPendiente = function (p) {
    const nuevo = Object.assign({
      id: U.uid("pend"),
      equipoKey: "",
      fechaCompromiso: U.todayISO(),
      tipo: "Otro",
      descripcion: "",
      tareas: [],
      responsableAdmin: "Cristián Beltrán Oviedo",
      responsableEjecutivo: "",
      gestiones: [],
      enEspera: null,        // { motivo }
      fechaCompletado: null,
      origen: "manual",
      vinculoMantencionId: null,
      createdAt: new Date().toISOString(),
    }, p);
    DB.pendientes.push(nuevo);
    Store.commit();
    return nuevo;
  };

  Store.guardarPendiente = function (p) {
    const i = DB.pendientes.findIndex((x) => x.id === p.id);
    if (i >= 0) DB.pendientes[i] = Object.assign(DB.pendientes[i], p);
    else { p.id = p.id || U.uid("pend"); DB.pendientes.push(p); }
    Store.commit();
    return p;
  };

  Store.eliminarPendiente = function (id) {
    DB.pendientes = DB.pendientes.filter((p) => p.id !== id);
    Store.commit();
  };

  Store.agregarGestion = function (pid, texto) {
    const p = DB.pendientes.find((x) => x.id === pid);
    if (!p) return;
    p.gestiones = p.gestiones || [];
    p.gestiones.push({ fecha: U.todayISO(), texto: texto, ts: new Date().toISOString() });
    Store.commit();
  };

  Store.completarPendiente = function (pid, gestion) {
    const p = DB.pendientes.find((x) => x.id === pid);
    if (!p) return;
    p.fechaCompletado = U.todayISO();
    p.enEspera = null;
    Store.agregarGestion(pid, gestion || "Pendiente completado.");
  };

  Store.posponerPendiente = function (pid, dias) {
    const p = DB.pendientes.find((x) => x.id === pid);
    if (!p) return;
    p.fechaCompromiso = U.addDays(p.fechaCompromiso, dias);
    Store.agregarGestion(pid, "Compromiso pospuesto " + dias + " día(s) → " + U.fmtDate(p.fechaCompromiso));
  };

  Store.marcarEnEspera = function (pid, motivo) {
    const p = DB.pendientes.find((x) => x.id === pid);
    if (!p) return;
    p.enEspera = { motivo: motivo || "Sin especificar" };
    Store.agregarGestion(pid, "En espera de un tercero: " + (motivo || ""));
  };

  Store.reanudarPendiente = function (pid) {
    const p = DB.pendientes.find((x) => x.id === pid);
    if (!p) return;
    p.enEspera = null;
    Store.agregarGestion(pid, "Espera finalizada, gestión reanudada.");
  };

  // Estado de gestión deducido automáticamente (Paso 9).
  Store.estadoPendiente = function (p) {
    if (p.fechaCompletado) return "Completado";
    if (p.enEspera) return "En espera";
    const tareasMarcadas = (p.tareas || []).some((t) => t.hecha);
    if ((p.gestiones || []).length > 0 || tareasMarcadas) return "En gestión";
    return "Nuevo";
  };

  Store.urgenciaPendiente = function (p) {
    if (p.fechaCompletado) return "Completado";
    if (p.enEspera) return "En espera";
    const dias = U.daysBetween(U.todayISO(), p.fechaCompromiso); // futuro positivo
    if (dias === null) return "Próximo";
    if (dias < 0) return "Atrasado";
    if (dias === 0) return "Hoy";
    if (dias <= 7) return "Esta semana";
    return "Próximo";
  };

  Store.diasAtraso = function (p) {
    if (p.fechaCompletado || p.enEspera) return 0;
    const d = U.daysBetween(p.fechaCompromiso, U.todayISO());
    return d > 0 ? d : 0;
  };

  /* =====================================================================
   * Expedientes correctivos (Paso 10 / 15)
   * =================================================================== */
  Store.crearExpediente = function (x) {
    const nuevo = Object.assign({
      id: U.uid("exp"),
      folioSigem: "",
      equipoKey: "",
      tipoEvento: "Orden de Trabajo",
      requerimiento: "",
      fechaDocumento: U.todayISO(),
      tecnico: "",
      estadoEquipo: "No Operativo",
      tipoCompra: "",
      informeTecnico: null,   // { numero, fecha, responsable, empresa }
      ordenCompra: null,      // { numero, fecha, descripcion }
      estadoEvento: "Abierto",
      fechaCierre: null,
      avances: [],            // bitácora auditable
      gestionPendiente: false,
      tipoRegistro: "Oficial",
      pendienteId: null,
      createdAt: new Date().toISOString(),
    }, x);
    DB.expedientes.push(nuevo);
    // Flujo crítico: equipo No Operativo crea pendiente con tareas del ciclo.
    if (nuevo.estadoEquipo === "No Operativo") {
      const pend = Store.crearPendiente({
        equipoKey: nuevo.equipoKey,
        tipo: "Protocolo Externo de Mantenimiento",
        descripcion: "Ciclo correctivo (flujo crítico) — Folio " + (nuevo.folioSigem || "s/folio"),
        fechaCompromiso: U.addDays(U.todayISO(), 7),
        origen: "correctivo",
        tareas: [
          { texto: "Solicitar cotización al proveedor", hecha: false },
          { texto: "Recibir cotización (n° y fecha)", hecha: false },
          { texto: "Elaborar informe técnico", hecha: false },
          { texto: "Emitir orden de compra", hecha: false },
          { texto: "Enviar orden de compra al proveedor", hecha: false },
        ],
      });
      nuevo.pendienteId = pend.id;
    }
    Store.commit();
    return nuevo;
  };

  Store.guardarExpediente = function (x) {
    const i = DB.expedientes.findIndex((e) => e.id === x.id);
    if (i >= 0) DB.expedientes[i] = Object.assign(DB.expedientes[i], x);
    else DB.expedientes.push(x);
    Store.commit();
    return x;
  };

  Store.eliminarExpediente = function (id) {
    DB.expedientes = DB.expedientes.filter((x) => x.id !== id);
    Store.commit();
  };

  // Registrar avance (bitácora auditable, Paso 10 / 12).
  Store.registrarAvance = function (expId, avance) {
    const x = DB.expedientes.find((e) => e.id === expId);
    if (!x) return null;
    const a = Object.assign({
      id: U.uid("av"),
      tipo: "nota",
      fechaReal: U.todayISO(),
      fechaRegistro: U.todayISO(),
      fechaCorreccion: null,
      datos: {},
    }, avance);
    x.avances = x.avances || [];
    x.avances.push(a);
    if (a.tipo === "cierre") {
      x.estadoEvento = "Cerrado";
      x.fechaCierre = a.fechaReal;
    }
    Store.commit();
    return a;
  };

  Store.corregirAvance = function (expId, avId, cambios) {
    const x = DB.expedientes.find((e) => e.id === expId);
    if (!x) return;
    const a = (x.avances || []).find((v) => v.id === avId);
    if (!a) return;
    Object.assign(a, cambios);
    a.fechaCorreccion = U.todayISO();
    Store.commit();
  };

  Store.eliminarAvance = function (expId, avId) {
    const x = DB.expedientes.find((e) => e.id === expId);
    if (!x) return;
    x.avances = (x.avances || []).filter((v) => v.id !== avId);
    if (!x.avances.some((v) => v.tipo === "cierre")) {
      x.estadoEvento = "Abierto"; x.fechaCierre = null;
    }
    Store.commit();
  };

  // Etapa actual del expediente = último hito registrado (Paso 12).
  Store.etapaExpediente = function (x) {
    if (x.estadoEvento === "Cerrado") return C.ETAPAS_CORR.CERRADO;
    const av = (x.avances || []).slice().sort(
      (a, b) => (a.fechaReal || "").localeCompare(b.fechaReal || ""));
    const ultimo = av[av.length - 1];
    if (!ultimo) return C.ETAPAS_CORR.APERTURA;
    switch (ultimo.tipo) {
      case "envio_st": return C.ETAPAS_CORR.EN_ST;
      case "retorno_st":
        return (ultimo.datos && ultimo.datos.estadoEquipo === "Operativo")
          ? C.ETAPAS_CORR.RETORNADO_OK : C.ETAPAS_CORR.RETORNADO_NOK;
      case "cotizacion_solicitada":
      case "cotizacion_recibida": return C.ETAPAS_CORR.COMPRA;
      case "informe_tecnico":
      case "oc_emitida": return C.ETAPAS_CORR.COMPRA;
      case "oc_enviada": return C.ETAPAS_CORR.ESPERA;
      case "visita_ejecucion": return C.ETAPAS_CORR.EJECUCION;
      case "evaluacion": return C.ETAPAS_CORR.EVALUACION;
      default: return C.ETAPAS_CORR.EVALUACION;
    }
  };

  Store.diasCicloExpediente = function (x) {
    const fin = x.fechaCierre || U.todayISO();
    return U.daysBetween(x.fechaDocumento, fin);
  };

  /* =====================================================================
   * Línea de tiempo unificada de eventos de estado por equipo (Paso 2/12)
   * Devuelve eventos { fecha, estado, origen, detalle } ordenados.
   * =================================================================== */
  Store.eventosEstado = function (key) {
    const eventos = [];
    const eq = Store.equipoByKey(key);

    // Mantenciones de la app
    Store.mantencionesDe(key).forEach((m) => {
      if (m.estadoEquipo) {
        eventos.push({
          fecha: m.fecha, estado: m.estadoEquipo, origen: "Preventivo (app)",
          detalle: "Mantención " + (m.programacion || "") + " · " + (m.resultado || ""),
        });
      }
    });

    // Resultados de planilla con impacto en operatividad (FS/NU/Baja)
    if (eq && eq.registro) {
      C.MESES.forEach((mes) => {
        const reg = eq.registro[mes.key];
        if (!reg || !reg.resultado) return;
        const r = reg.resultado;
        let estado = null, detalle = "";
        if (r === "FS") { estado = C.ESTADO.NO_OPERATIVO; detalle = "Fuera de Servicio (planilla)"; }
        else if (r === "NU") { estado = C.ESTADO.NO_OPERATIVO; detalle = "No Ubicable (planilla)"; }
        else if (r === "Baja") { estado = C.ESTADO.NO_OPERATIVO; detalle = "Dado de Baja (planilla)"; }
        if (estado) {
          eventos.push({
            fecha: U.lastDayOfMonthISO(2026, mes.num), estado, origen: "Planilla",
            detalle,
          });
        }
      });
    }

    // Avances correctivos
    Store.expedientesDe(key).forEach((x) => {
      eventos.push({
        fecha: x.fechaDocumento, estado: x.estadoEquipo,
        origen: "Correctivo (apertura)", detalle: "Folio " + (x.folioSigem || ""),
      });
      (x.avances || []).forEach((a) => {
        if (a.tipo === "envio_st") {
          eventos.push({ fecha: a.fechaReal, estado: C.ESTADO.SERVICIO_TECNICO,
            origen: "Correctivo", detalle: "Envío a servicio técnico" });
        } else if (a.tipo === "retorno_st" || a.tipo === "visita_ejecucion") {
          const est = (a.datos && a.datos.estadoEquipo) || C.ESTADO.OPERATIVO;
          eventos.push({ fecha: a.fechaReal, estado: est,
            origen: "Correctivo", detalle: a.tipo === "retorno_st" ? "Retorno servicio técnico" : "Visita / Ejecución" });
        } else if (a.tipo === "cierre") {
          eventos.push({ fecha: a.fechaReal, estado: x.estadoEquipo,
            origen: "Correctivo", detalle: "Cierre del expediente" });
        }
      });
    });

    return eventos
      .filter((e) => e.fecha && e.estado)
      .sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  };

  // Estado actual del equipo + días en estado + última actualización (Paso 2).
  Store.estadoEquipo = function (key) {
    const eventos = Store.eventosEstado(key);
    if (!eventos.length) {
      return { estado: C.ESTADO.OPERATIVO, desde: null, dias: null, asumido: true };
    }
    const ultimo = eventos[eventos.length - 1];
    // Inicio de la racha del estado actual.
    let desde = ultimo.fecha;
    for (let i = eventos.length - 1; i >= 0; i--) {
      if (eventos[i].estado === ultimo.estado) desde = eventos[i].fecha;
      else break;
    }
    return {
      estado: ultimo.estado,
      desde,
      dias: U.daysBetween(desde, U.todayISO()),
      asumido: false,
    };
  };

  Store.ultimaActualizacion = function (key) {
    let max = null;
    const upd = (iso) => { if (iso && (!max || iso > max)) max = iso; };
    Store.mantencionesDe(key).forEach((m) => { upd(m.fecha); upd((m.createdAt || "").slice(0, 10)); });
    Store.pendientesDe(key).forEach((p) => {
      upd(p.fechaCompromiso);
      (p.gestiones || []).forEach((g) => upd(g.fecha));
      upd(p.fechaCompletado);
    });
    Store.expedientesDe(key).forEach((x) => {
      upd(x.fechaDocumento); upd(x.fechaCierre);
      (x.avances || []).forEach((a) => upd(a.fechaReal));
    });
    return max;
  };

  Store.pendientesAbiertosDe = function (key) {
    return Store.pendientesDe(key).filter((p) => !p.fechaCompletado);
  };

})(window);


/* ===== assets/js/core/ui.js ===== */
/* =========================================================================
 * MP 2026 · ui.js
 * Componentes de interfaz reutilizables: toast, modal y DataTable
 * (tabla tipo Excel con filtros por columna, búsqueda global, selector
 *  de columnas, paginación y exportación).
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const el = U.el;
  const UI = MP.ui = {};

  /* ----- Toasts ------------------------------------------------------- */
  UI.toast = function (msg, tipo) {
    let cont = document.getElementById("toast-cont");
    if (!cont) {
      cont = el("div", { id: "toast-cont", class: "toast-cont" });
      document.body.appendChild(cont);
    }
    const t = el("div", { class: "toast toast-" + (tipo || "info") }, msg);
    cont.appendChild(t);
    setTimeout(() => t.classList.add("show"), 10);
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3600);
  };

  /* ----- Modal -------------------------------------------------------- */
  UI.modal = function (opts) {
    opts = opts || {};
    const overlay = el("div", { class: "modal-overlay" });
    const box = el("div", { class: "modal-box " + (opts.size || "") });
    const head = el("div", { class: "modal-head" }, [
      el("h3", { text: opts.title || "" }),
      el("button", { class: "modal-x", title: "Cerrar", onclick: close }, "✕"),
    ]);
    const body = el("div", { class: "modal-body" });
    if (typeof opts.body === "string") body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);
    box.appendChild(head); box.appendChild(body);
    if (opts.footer) {
      const foot = el("div", { class: "modal-foot" });
      (Array.isArray(opts.footer) ? opts.footer : [opts.footer]).forEach((f) => foot.appendChild(f));
      box.appendChild(foot);
    }
    overlay.appendChild(box);
    overlay.addEventListener("click", (e) => { if (e.target === overlay && opts.dismissable !== false) close(); });
    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";
    function close() { overlay.remove(); document.body.style.overflow = ""; if (opts.onClose) opts.onClose(); }
    const api = { close, overlay, body };
    return api;
  };

  UI.confirm = function (msg, onYes, opts) {
    opts = opts || {};
    const m = UI.modal({
      title: opts.title || "Confirmar",
      size: "sm",
      body: el("p", { class: "confirm-msg", html: msg }),
      footer: [
        el("button", { class: "btn ghost", onclick: () => m.close() }, opts.cancelText || "Cancelar"),
        el("button", { class: "btn " + (opts.danger ? "danger" : "primary"),
          onclick: () => { m.close(); onYes && onYes(); } }, opts.okText || "Confirmar"),
      ],
    });
    return m;
  };

  /* ----- Botón utilitario -------------------------------------------- */
  UI.btn = function (label, cls, onClick, attrs) {
    return el("button", Object.assign({ class: "btn " + (cls || ""), onclick: onClick }, attrs || {}), label);
  };

  /* =====================================================================
   * DataTable — tabla tipo Excel reutilizable.
   *
   * config = {
   *   columns: [{ key, label, group?, render?(row,val), value?(row),
   *               filterable=true, sortable=true, defaultVisible=true,
   *               className?, align? }],
   *   rows: [...objetos],
   *   rowClass?: (row)=>string,
   *   onRowClick?: (row)=>void,
   *   pageSize?: number (def 25),
   *   exportName?: string,
   *   storageKey?: string  (recuerda columnas visibles)
   *   toolbarExtra?: [DOMNode]  (botones extra a la izquierda)
   *   emptyText?: string
   * }
   * ===================================================================== */
  UI.DataTable = function (config) {
    const cols = config.columns.map((c) => Object.assign({
      filterable: true, sortable: true, defaultVisible: true,
    }, c));
    const state = {
      rows: config.rows || [],
      filters: {},          // key -> Set de valores permitidos
      sort: { key: null, dir: 1 },
      page: 1,
      pageSize: config.pageSize || 25,
      search: "",
      visible: {},
    };
    // Visibilidad inicial (persistida si hay storageKey).
    cols.forEach((c) => { state.visible[c.key] = c.defaultVisible !== false; });
    if (config.storageKey) {
      try {
        const saved = JSON.parse(localStorage.getItem("dt_cols_" + config.storageKey) || "null");
        if (saved) cols.forEach((c) => { if (c.key in saved) state.visible[c.key] = saved[c.key]; });
      } catch (e) {}
    }

    const root = el("div", { class: "dt" });

    function valueOf(row, c) {
      const v = c.value ? c.value(row) : row[c.key];
      return v === null || v === undefined ? "" : v;
    }
    function displayText(row, c) {
      // Texto plano para búsqueda/filtros (no HTML).
      if (c.text) return U.asText(c.text(row));
      return U.asText(valueOf(row, c));
    }

    function filteredRows() {
      let rows = state.rows.slice();
      // Filtros por columna
      Object.keys(state.filters).forEach((k) => {
        const set = state.filters[k];
        if (!set || set.size === 0) return;
        const c = cols.find((x) => x.key === k);
        rows = rows.filter((r) => set.has(displayText(r, c)));
      });
      // Búsqueda global
      const q = U.norm(state.search);
      if (q) {
        rows = rows.filter((r) =>
          cols.some((c) => U.norm(displayText(r, c)).indexOf(q) >= 0));
      }
      // Orden
      if (state.sort.key) {
        const c = cols.find((x) => x.key === state.sort.key);
        rows.sort((a, b) => {
          const va = displayText(a, c), vb = displayText(b, c);
          const na = parseFloat(va), nb = parseFloat(vb);
          let cmp;
          if (!isNaN(na) && !isNaN(nb) && va.trim() !== "" && vb.trim() !== "") cmp = na - nb;
          else cmp = va.localeCompare(vb, "es", { numeric: true });
          return cmp * state.sort.dir;
        });
      }
      return rows;
    }

    let lastFiltered = [];

    function render() {
      root.innerHTML = "";
      const visibleCols = cols.filter((c) => state.visible[c.key]);
      const rows = filteredRows();
      lastFiltered = rows;

      /* Toolbar */
      const toolbar = el("div", { class: "dt-toolbar" });
      (config.toolbarExtra || []).forEach((n) => toolbar.appendChild(n));
      const search = el("input", { class: "dt-search", type: "search",
        placeholder: "🔍 Búsqueda global…", value: state.search });
      search.addEventListener("input", () => { state.search = search.value; state.page = 1; render(); });
      toolbar.appendChild(search);

      const count = el("span", { class: "dt-count" },
        rows.length + " de " + state.rows.length + " registros");
      toolbar.appendChild(count);

      const spacer = el("span", { class: "dt-spacer" });
      toolbar.appendChild(spacer);

      // Selector de columnas
      const colBtn = UI.btn("⚙ Columnas", "ghost sm", (e) => openColChooser(e.currentTarget));
      toolbar.appendChild(colBtn);

      // Exportar
      if (config.exportName !== false) {
        toolbar.appendChild(UI.btn("⬇ Exportar", "ghost sm", () => {
          MP.excel.exportTable(visibleCols, rows, displayText, config.exportName || "tabla");
        }));
      }
      // Limpiar filtros
      toolbar.appendChild(UI.btn("✕ Limpiar", "ghost sm", () => {
        state.filters = {}; state.search = ""; state.sort = { key: null, dir: 1 }; state.page = 1; render();
      }));

      root.appendChild(toolbar);

      /* Tabla */
      const wrap = el("div", { class: "dt-scroll" });
      const table = el("table", { class: "dt-table" });

      // ¿Hay grupos? (para Plan de Mantenimiento con meses)
      const hasGroups = visibleCols.some((c) => c.group);
      const thead = el("thead");
      if (hasGroups) {
        const trG = el("tr", { class: "dt-grouprow" });
        let i = 0;
        while (i < visibleCols.length) {
          const g = visibleCols[i].group || null;
          let span = 1;
          while (i + span < visibleCols.length && (visibleCols[i + span].group || null) === g) span++;
          trG.appendChild(el("th", { colspan: span, class: g ? "dt-group" : "" }, g || ""));
          i += span;
        }
        thead.appendChild(trG);
      }

      const trH = el("tr");
      visibleCols.forEach((c) => {
        const th = el("th", { class: (c.className || "") + (c.align ? " ta-" + c.align : "") });
        const wrapTh = el("div", { class: "th-inner" });
        const lab = el("span", { class: "th-label", text: c.label });
        if (c.sortable) {
          lab.style.cursor = "pointer";
          lab.addEventListener("click", () => {
            if (state.sort.key === c.key) state.sort.dir *= -1;
            else { state.sort.key = c.key; state.sort.dir = 1; }
            render();
          });
          if (state.sort.key === c.key) lab.textContent += state.sort.dir > 0 ? " ▲" : " ▼";
        }
        wrapTh.appendChild(lab);
        if (c.filterable) {
          const active = state.filters[c.key] && state.filters[c.key].size > 0;
          const fb = el("button", { class: "th-filter" + (active ? " active" : ""), title: "Filtrar" }, "▾");
          fb.addEventListener("click", (e) => { e.stopPropagation(); openColFilter(c, fb); });
          wrapTh.appendChild(fb);
        }
        th.appendChild(wrapTh);
        trH.appendChild(th);
      });
      thead.appendChild(trH);
      table.appendChild(thead);

      const tbody = el("tbody");
      const start = (state.page - 1) * state.pageSize;
      const pageRows = rows.slice(start, start + state.pageSize);
      if (pageRows.length === 0) {
        tbody.appendChild(el("tr", {}, el("td", { colspan: visibleCols.length, class: "dt-empty" },
          config.emptyText || "Sin registros que coincidan con los filtros.")));
      }
      pageRows.forEach((row) => {
        const tr = el("tr", { class: config.rowClass ? config.rowClass(row) : "" });
        if (config.onRowClick) {
          tr.classList.add("clickable");
          tr.addEventListener("click", (e) => {
            if (e.target.closest(".no-rowclick")) return;
            config.onRowClick(row);
          });
        }
        visibleCols.forEach((c) => {
          const td = el("td", { class: (c.className || "") + (c.align ? " ta-" + c.align : "") });
          const content = c.render ? c.render(row, valueOf(row, c)) : valueOf(row, c);
          if (content instanceof Node) td.appendChild(content);
          else if (c.html) td.innerHTML = c.html(row);
          else td.textContent = U.asText(content);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      root.appendChild(wrap);

      /* Paginación */
      const totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
      if (state.page > totalPages) state.page = totalPages;
      const pag = el("div", { class: "dt-pag" });
      pag.appendChild(UI.btn("«", "ghost sm", () => { state.page = 1; render(); }, { disabled: state.page === 1 }));
      pag.appendChild(UI.btn("‹", "ghost sm", () => { state.page = Math.max(1, state.page - 1); render(); }, { disabled: state.page === 1 }));
      pag.appendChild(el("span", { class: "dt-pageinfo" }, "Página " + state.page + " / " + totalPages));
      pag.appendChild(UI.btn("›", "ghost sm", () => { state.page = Math.min(totalPages, state.page + 1); render(); }, { disabled: state.page === totalPages }));
      pag.appendChild(UI.btn("»", "ghost sm", () => { state.page = totalPages; render(); }, { disabled: state.page === totalPages }));
      const sizeSel = el("select", { class: "dt-pagesize" },
        [10, 25, 50, 100, 250].map((n) => el("option", { value: n, selected: n === state.pageSize }, n + " / pág.")));
      sizeSel.addEventListener("change", () => { state.pageSize = +sizeSel.value; state.page = 1; render(); });
      pag.appendChild(sizeSel);
      root.appendChild(pag);
    }

    /* ----- Popover de filtro de columna (estilo Excel) --------------- */
    function openColFilter(c, anchor) {
      closePopovers();
      const distinct = Array.from(new Set(state.rows.map((r) => displayText(r, c))))
        .sort((a, b) => a.localeCompare(b, "es", { numeric: true }));
      const current = state.filters[c.key] || new Set(distinct);
      const pop = el("div", { class: "dt-pop" });
      pop.addEventListener("click", (e) => e.stopPropagation());

      // Orden
      const ord = el("div", { class: "dt-pop-sort" }, [
        UI.btn("▲ Orden A→Z", "ghost sm", () => { state.sort = { key: c.key, dir: 1 }; closePopovers(); render(); }),
        UI.btn("▼ Orden Z→A", "ghost sm", () => { state.sort = { key: c.key, dir: -1 }; closePopovers(); render(); }),
      ]);
      pop.appendChild(ord);

      const sb = el("input", { class: "dt-pop-search", type: "search", placeholder: "Buscar valor…" });
      pop.appendChild(sb);

      const list = el("div", { class: "dt-pop-list" });
      const selectAll = el("label", { class: "dt-pop-item all" }, [
        (() => { const cb = el("input", { type: "checkbox" }); cb.checked = current.size === distinct.length;
          cb.addEventListener("change", () => {
            list.querySelectorAll("input[data-v]").forEach((i) => {
              if (i.parentElement.style.display !== "none") i.checked = cb.checked;
            });
          }); return cb; })(),
        el("span", {}, "(Seleccionar todo)"),
      ]);
      list.appendChild(selectAll);
      distinct.forEach((v) => {
        const cb = el("input", { type: "checkbox", "data-v": v });
        cb.checked = current.has(v);
        list.appendChild(el("label", { class: "dt-pop-item" }, [cb, el("span", {}, v === "" ? "(vacío)" : v)]));
      });
      sb.addEventListener("input", () => {
        const q = U.norm(sb.value);
        list.querySelectorAll(".dt-pop-item:not(.all)").forEach((it) => {
          it.style.display = U.norm(it.textContent).indexOf(q) >= 0 ? "" : "none";
        });
      });
      pop.appendChild(list);

      const foot = el("div", { class: "dt-pop-foot" }, [
        UI.btn("Aplicar", "primary sm", () => {
          const chosen = new Set();
          list.querySelectorAll("input[data-v]").forEach((i) => { if (i.checked) chosen.add(i.getAttribute("data-v")); });
          if (chosen.size === distinct.length) delete state.filters[c.key];
          else state.filters[c.key] = chosen;
          state.page = 1; closePopovers(); render();
        }),
        UI.btn("Quitar filtro", "ghost sm", () => { delete state.filters[c.key]; closePopovers(); render(); }),
      ]);
      pop.appendChild(foot);

      document.body.appendChild(pop);
      positionPop(pop, anchor);
    }

    function openColChooser(anchor) {
      closePopovers();
      const pop = el("div", { class: "dt-pop" });
      pop.addEventListener("click", (e) => e.stopPropagation());
      pop.appendChild(el("div", { class: "dt-pop-title" }, "Columnas visibles"));
      const list = el("div", { class: "dt-pop-list" });
      cols.forEach((c) => {
        const cb = el("input", { type: "checkbox" });
        cb.checked = state.visible[c.key];
        cb.addEventListener("change", () => {
          state.visible[c.key] = cb.checked;
          if (config.storageKey) localStorage.setItem("dt_cols_" + config.storageKey, JSON.stringify(state.visible));
        });
        list.appendChild(el("label", { class: "dt-pop-item" }, [cb, el("span", {}, c.label)]));
      });
      pop.appendChild(list);
      pop.appendChild(el("div", { class: "dt-pop-foot" }, [
        UI.btn("Aplicar", "primary sm", () => { closePopovers(); render(); }),
      ]));
      document.body.appendChild(pop);
      positionPop(pop, anchor);
    }

    function positionPop(pop, anchor) {
      const r = anchor.getBoundingClientRect();
      pop.style.position = "fixed";
      pop.style.top = Math.min(r.bottom + 4, window.innerHeight - 360) + "px";
      pop.style.left = Math.min(r.left, window.innerWidth - 280) + "px";
      setTimeout(() => document.addEventListener("click", closePopovers, { once: true }), 0);
    }
    function closePopovers() {
      document.querySelectorAll(".dt-pop").forEach((p) => p.remove());
    }

    render();
    return {
      root,
      setRows(rows) { state.rows = rows; state.page = 1; render(); },
      getFiltered() { return lastFiltered; },
      refresh: render,
    };
  };

})(window);


/* ===== assets/js/core/excel.js ===== */
/* =========================================================================
 * MP 2026 · excel.js
 * Importación de la planilla (Pasos 1, 3, 4) y exportaciones (Paso 11).
 * Usa SheetJS (XLSX) cargado vía CDN. Si no está disponible, las
 * funciones de importación se deshabilitan con aviso (degradación elegante).
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;
  const C = MP.const;
  const Store = MP.store;
  const Excel = MP.excel = {};

  Excel.disponible = function () { return typeof global.XLSX !== "undefined"; };

  // Índice de columna (letra → 0-based). "B"->1, "AE"->30
  function colIdx(letter) {
    let n = 0;
    for (let i = 0; i < letter.length; i++) n = n * 26 + (letter.charCodeAt(i) - 64);
    return n - 1;
  }

  // Lee celda de una fila (array) por letra de columna.
  function cell(row, letter) {
    const v = row[colIdx(letter)];
    return v === undefined || v === null ? "" : v;
  }

  /* ----- Mapeo de meses ↔ columnas (Pasos 3 y 4) --------------------- */
  // PMP_2026 programación: T–AE (un valor por mes)
  const PMP_MES_COLS = ["T", "U", "V", "W", "X", "Y", "Z", "AA", "AB", "AC", "AD", "AE"];
  // Registro_MP-2026: cada mes ocupa dos columnas (Programa P, Resultado R)
  const REG_MES_COLS = [
    { p: "T", r: "U" }, { p: "V", r: "W" }, { p: "X", r: "Y" }, { p: "Z", r: "AA" },
    { p: "AB", r: "AC" }, { p: "AD", r: "AE" }, { p: "AF", r: "AG" }, { p: "AH", r: "AI" },
    { p: "AJ", r: "AK" }, { p: "AL", r: "AM" }, { p: "AN", r: "AO" }, { p: "AP", r: "AQ" },
  ];

  function normPrograma(v) {
    const s = U.asText(v).toUpperCase();
    return C.PROGRAMA_VALIDOS.includes(s) ? s : "";
  }
  function normResultado(v) {
    let s = U.asText(v);
    // Normaliza variantes comunes de "Si" y "Si-RA".
    const up = s.toUpperCase();
    if (up === "SI") return "Si";
    if (up === "SI-RA" || up === "SIRA") return "Si-RA";
    if (C.RESULTADO_VALIDOS.includes(s)) return s;
    // case-insensitive match
    const m = C.RESULTADO_VALIDOS.find((x) => x.toUpperCase() === up);
    return m || "";
  }

  /* =====================================================================
   * Importar planilla completa.
   * Lee la hoja PMP_2026 (equipos + programación) y, si existe,
   * Registro_MP-2026 (programa/resultado por mes).
   * ===================================================================== */
  Excel.importarPlanilla = function (arrayBuffer) {
    if (!Excel.disponible()) throw new Error("La librería de Excel (SheetJS) no está disponible. Conéctese a internet o use la importación por respaldo JSON.");
    const wb = global.XLSX.read(arrayBuffer, { type: "array" });

    const hojaPMP = encontrarHoja(wb, ["PMP_2026", "PMP 2026", "PMP", "Programación", "Programacion"]);
    if (!hojaPMP) throw new Error("No se encontró la hoja PMP_2026 en el archivo.");

    const rows = global.XLSX.utils.sheet_to_json(wb.Sheets[hojaPMP], {
      header: 1, raw: false, defval: "", blankrows: false,
    });

    // Encabezados fila 7 (índice 6); datos desde fila 8 (índice 7).
    const equipos = [];
    let id = 0;
    for (let i = 7; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.length === 0) continue;
      // Saltar filas totalmente vacías en el bloque de datos.
      const equipoNombre = U.asText(cell(row, "E"));
      const serie = U.asText(cell(row, "L"));
      const inv = U.asText(cell(row, "D"));
      if (!equipoNombre && !serie && !inv) continue;

      id++;
      const eq = {
        id: id,
        nCarpeta: U.asText(cell(row, "C")),
        nInventario: inv,                       // texto, ceros a la izq.
        equipo: equipoNombre,
        servicio: U.asText(cell(row, "F")),
        unidad: U.asText(cell(row, "G")),
        ubicacion: U.asText(cell(row, "H")),
        procedencia: U.asText(cell(row, "I")),
        marca: U.asText(cell(row, "J")),
        modelo: U.asText(cell(row, "K")),
        serie: serie,                           // texto, ceros a la izq.
        anioInstalacion: U.asText(cell(row, "M")),
        vidaUtilResidual: U.asText(cell(row, "N")),
        clasificacion: U.asText(cell(row, "O")),
        enuBaja: U.asText(cell(row, "P")),
        programacion: {},
        registro: {},
      };
      // Programación por mes (T–AE) — Paso 3
      C.MESES.forEach((mes, idx) => {
        const v = normPrograma(cell(row, PMP_MES_COLS[idx]));
        if (v) eq.programacion[mes.key] = v;
      });
      equipos.push(eq);
    }

    if (equipos.length === 0) throw new Error("No se leyeron equipos. Verifique que los datos estén desde la fila 8.");

    // Hoja de registro (opcional)
    const hojaReg = encontrarHoja(wb, ["Registro_MP-2026", "Registro_MP_2026", "Registro MP 2026", "Registro", "Registro_MP"]);
    let registrosLeidos = 0;
    if (hojaReg) {
      const rrows = global.XLSX.utils.sheet_to_json(wb.Sheets[hojaReg], {
        header: 1, raw: false, defval: "", blankrows: false,
      });
      const porSerie = {}, porInv = {};
      equipos.forEach((e) => {
        if (e.serie) porSerie[e.serie] = e;
        if (e.nInventario) porInv[e.nInventario] = e;
      });
      for (let i = 7; i < rrows.length; i++) {
        const row = rrows[i];
        if (!row || row.length === 0) continue;
        const serie = U.asText(cell(row, "L"));
        const inv = U.asText(cell(row, "D"));
        const eq = porSerie[serie] || porInv[inv];
        if (!eq) continue;
        REG_MES_COLS.forEach((mc, idx) => {
          const p = normPrograma(cell(row, mc.p));
          const r = normResultado(cell(row, mc.r));
          if (p || r) {
            eq.registro[C.MESES[idx].key] = { programa: p, resultado: r };
            registrosLeidos++;
          }
        });
        const obs = U.asText(cell(row, "AR"));
        if (obs) eq.observacionPlanilla = obs;
      }
    }

    // Reconciliación Oficial/Borrador (Paso 4): borradores que reaparecen
    // en la planilla recargada pasan a Oficial.
    reconciliarBorradores(equipos);

    Store.db.equipos = equipos;
    Store.db.meta.ultimaCarga = new Date().toISOString();
    if (!Store.db.meta.creado) Store.db.meta.creado = new Date().toISOString();
    Store.commit();

    return { equipos: equipos.length, registros: registrosLeidos, conRegistro: !!hojaReg };
  };

  function reconciliarBorradores(equiposNuevos) {
    const idx = {};
    equiposNuevos.forEach((e) => {
      const k = U.equipoKey(e);
      idx[k] = e;
    });
    Store.db.mantenciones.forEach((m) => {
      if (m.tipoRegistro !== "Borrador") return;
      const eq = idx[m.equipoKey];
      if (!eq) return;
      const mesKey = U.mesKeyFromISO(m.fecha);
      const reg = eq.registro[mesKey];
      if (reg && (reg.programa || reg.resultado)) {
        m.tipoRegistro = "Oficial"; // pasó a estar en la planilla
      }
    });
  }

  function encontrarHoja(wb, candidatos) {
    const nombres = wb.SheetNames;
    for (const c of candidatos) {
      const hit = nombres.find((n) => n.trim().toLowerCase() === c.trim().toLowerCase());
      if (hit) return hit;
    }
    // coincidencia parcial
    for (const c of candidatos) {
      const hit = nombres.find((n) => U.norm(n).indexOf(U.norm(c)) >= 0);
      if (hit) return hit;
    }
    return null;
  }

  /* =====================================================================
   * Exportaciones (Paso 11)
   * ===================================================================== */
  // Marca las columnas que deben conservar ceros a la izquierda como texto.
  function aoaToSheetConTexto(aoa, colsTexto) {
    const ws = global.XLSX.utils.aoa_to_sheet(aoa);
    // Forzar formato texto en columnas indicadas (índices 0-based).
    const range = global.XLSX.utils.decode_range(ws["!ref"]);
    (colsTexto || []).forEach((ci) => {
      for (let r = 1; r <= range.e.r; r++) {
        const addr = global.XLSX.utils.encode_cell({ r, c: ci });
        const cellRef = ws[addr];
        if (cellRef) { cellRef.t = "s"; cellRef.z = "@"; cellRef.v = U.asText(cellRef.v); }
      }
    });
    return ws;
  }

  // Exporta una DataTable genérica (columnas visibles, filas filtradas).
  Excel.exportTable = function (visibleCols, rows, displayText, nombre) {
    if (!Excel.disponible()) { MP.ui.toast("Excel no disponible (sin conexión a SheetJS).", "warn"); return; }
    const header = visibleCols.map((c) => c.group ? (c.group + " · " + c.label) : c.label);
    const aoa = [header];
    rows.forEach((r) => aoa.push(visibleCols.map((c) => displayText(r, c))));
    // columnas texto: serie / inventario
    const colsTexto = [];
    visibleCols.forEach((c, i) => {
      if (/serie|inventario/i.test(c.key) || /serie|inventario/i.test(c.label)) colsTexto.push(i);
    });
    const ws = aoaToSheetConTexto(aoa, colsTexto);
    const wb = global.XLSX.utils.book_new();
    global.XLSX.utils.book_append_sheet(wb, ws, "Datos");
    global.XLSX.writeFile(wb, (nombre || "export") + "_" + U.todayISO() + ".xlsx");
  };

  // Descargar todos los registros (Paso 11) — un libro con varias hojas.
  Excel.descargarTodo = function () {
    if (!Excel.disponible()) { MP.ui.toast("Excel no disponible (sin conexión a SheetJS).", "warn"); return; }
    const wb = global.XLSX.utils.book_new();

    // Hoja Equipos
    const eqHead = ["ID", "N° Carpeta", "N° Inventario", "Equipo", "Servicio", "Unidad",
      "Ubicación", "Procedencia", "Marca", "Modelo", "Serie", "Año Instalación",
      "Vida Útil Residual", "Clasificación", "ENU/Baja"];
    const eqAoa = [eqHead];
    Store.db.equipos.forEach((e) => eqAoa.push([
      e.id, e.nCarpeta, e.nInventario, e.equipo, e.servicio, e.unidad, e.ubicacion,
      e.procedencia, e.marca, e.modelo, e.serie, e.anioInstalacion, e.vidaUtilResidual,
      e.clasificacion, e.enuBaja,
    ]));
    global.XLSX.utils.book_append_sheet(wb, aoaToSheetConTexto(eqAoa, [2, 10]), "Equipos");

    // Hoja Mantenciones (app)
    const mHead = ["Equipo", "Serie", "N° Inventario", "Fecha", "Mes", "Programación",
      "Ejecutor", "Resultado", "Estado equipo", "Tipo registro", "Observaciones"];
    const mAoa = [mHead];
    Store.db.mantenciones.forEach((m) => {
      const eq = Store.equipoByKey(m.equipoKey) || {};
      mAoa.push([eq.equipo || "", eq.serie || "", eq.nInventario || "", m.fecha,
        U.mesNombre(U.mesKeyFromISO(m.fecha)), m.programacion, m.ejecutor, m.resultado,
        m.estadoEquipo, m.tipoRegistro, m.observaciones]);
    });
    global.XLSX.utils.book_append_sheet(wb, aoaToSheetConTexto(mAoa, [1, 2]), "Mantenciones");

    // Hoja Pendientes
    const pHead = ["Equipo", "Serie", "N° Inventario", "Tipo", "Estado", "Urgencia",
      "Compromiso", "Días atraso", "Responsable Admin.", "Responsable Ejec.", "Descripción", "Completado"];
    const pAoa = [pHead];
    Store.db.pendientes.forEach((p) => {
      const eq = Store.equipoByKey(p.equipoKey) || {};
      pAoa.push([eq.equipo || "", eq.serie || "", eq.nInventario || "", p.tipo,
        Store.estadoPendiente(p), Store.urgenciaPendiente(p), p.fechaCompromiso,

        p.fechaCompletado || ""]);
    });
    global.XLSX.utils.book_append_sheet(wb, aoaToSheetConTexto(pAoa, [1, 2]), "Pendientes");

    // Hoja Correctivo
    const cHead = ["Folio SIGEM", "Equipo", "Serie", "N° Inventario", "Tipo", "Fecha documento",
      "Técnico", "Etapa", "Estado evento", "Fecha cierre", "Días ciclo"];
    const cAoa = [cHead];
    Store.db.expedientes.forEach((x) => {
      const eq = Store.equipoByKey(x.equipoKey) || {};
      cAoa.push([x.folioSigem, eq.equipo || "", eq.serie || "", eq.nInventario || "",
        x.tipoEvento, x.fechaDocumento, x.tecnico, Store.etapaExpediente(x), x.estadoEvento,

    });
    global.XLSX.utils.book_append_sheet(wb, aoaToSheetConTexto(cAoa, [2, 3]), "Correctivo");

    global.XLSX.writeFile(wb, "Registros_MP2026_" + U.todayISO() + ".xlsx");
  };

})(window);

/* ===== assets/js/core/grabacion.js ===== */
/* =========================================================================
 * MP 2026 · grabacion.js
 * Paso 14 — Grabación de sesión para mejora continua.
 * Registra localmente la interacción (clics, escritura, navegación,
 * apertura de formularios, filtros, desplazamiento, foco y tiempos)
 * SIN enviar nada fuera del computador. Al detener, descarga un .json.
 * ========================================================================= */
(function (global) {
  "use strict";
  const MP = global.MP;
  const U = MP.util;

  const Rec = MP.grabacion = {};
  let activa = false;
  let eventos = [];
  let inicio = 0;
  let ultimoClickTarget = null;
  let clicksRepetidos = 0;
  let tiempoFueraFoco = 0;
  let foraDesde = 0;
  let vistaActual = null;
  let vistaDesde = 0;
  const tiempoPorVista = {};
  const handlers = {};

  function t() { return Date.now() - inicio; }

  function log(tipo, datos) {
    if (!activa) return;
    eventos.push(Object.assign({ t: t(), tipo }, datos || {}));
  }

  Rec.activa = function () { return activa; };

  Rec.notarVista = function (vista) {
    if (!activa) return;
    const ahora = Date.now();
    if (vistaActual) tiempoPorVista[vistaActual] = (tiempoPorVista[vistaActual] || 0) + (ahora - vistaDesde);
    vistaActual = vista; vistaDesde = ahora;
    log("navegacion", { vista });
  };

  Rec.notarFormulario = function (nombre, resultado, duracionMs) {
    log("formulario", { nombre, resultado, duracionMs });
  };

  Rec.start = function () {
    if (activa) return;
    activa = true; eventos = []; inicio = Date.now();
    tiempoFueraFoco = 0; clicksRepetidos = 0;
    vistaActual = MP.app ? MP.app.vistaActual : null; vistaDesde = Date.now();
    Object.keys(tiempoPorVista).forEach((k) => delete tiempoPorVista[k]);

    handlers.click = (e) => {
      const tgt = e.target;
      const desc = describir(tgt);
      if (ultimoClickTarget === desc) clicksRepetidos++; else clicksRepetidos = 0;
      ultimoClickTarget = desc;
      log("click", { objetivo: desc, repetido: clicksRepetidos > 0, x: e.clientX, y: e.clientY });
    };
    handlers.input = (e) => {
      const tgt = e.target;
      if (tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA" || tgt.tagName === "SELECT")) {
        log("escritura", { objetivo: describir(tgt), largo: (tgt.value || "").length });
      }
    };
    let scrollTO;
    handlers.scroll = () => {
      clearTimeout(scrollTO);
      scrollTO = setTimeout(() => log("desplazamiento", { y: Math.round(global.scrollY) }), 150);
    };
    handlers.blur = () => { foraDesde = Date.now(); log("foco", { estado: "fuera" }); };
    handlers.focus = () => {
      if (foraDesde) { tiempoFueraFoco += Date.now() - foraDesde; foraDesde = 0; }
      log("foco", { estado: "dentro" });
    };
    handlers.beforeunload = (e) => {
      if (activa) { e.preventDefault(); e.returnValue = ""; return ""; }
    };

    document.addEventListener("click", handlers.click, true);
    document.addEventListener("input", handlers.input, true);
    global.addEventListener("scroll", handlers.scroll, true);
    global.addEventListener("blur", handlers.blur);
    global.addEventListener("focus", handlers.focus);
    global.addEventListener("beforeunload", handlers.beforeunload);

    log("inicio", { ua: navigator.userAgent });
    MP.ui.toast("Grabación iniciada (solo local).", "info");
  };

  Rec.stop = function () {
    if (!activa) return;
    activa = false;
    if (vistaActual) tiempoPorVista[vistaActual] = (tiempoPorVista[vistaActual] || 0) + (Date.now() - vistaDesde);
    if (foraDesde) { tiempoFueraFoco += Date.now() - foraDesde; foraDesde = 0; }

    document.removeEventListener("click", handlers.click, true);
    document.removeEventListener("input", handlers.input, true);
    global.removeEventListener("scroll", handlers.scroll, true);
    global.removeEventListener("blur", handlers.blur);
    global.removeEventListener("focus", handlers.focus);
    global.removeEventListener("beforeunload", handlers.beforeunload);

    const duracionTotal = Date.now() - inicio;
    const resumen = {
      _app: "MP2026-grabacion", fecha: new Date().toISOString(),
      duracionMs: duracionTotal,
      tiempoActivoMs: duracionTotal - tiempoFueraFoco,
      tiempoFueraFocoMs: tiempoFueraFoco,
      tiempoPorVistaMs: tiempoPorVista,
      totalEventos: eventos.length,
      clics: eventos.filter((e) => e.tipo === "click").length,
      clicsRepetidos: eventos.filter((e) => e.tipo === "click" && e.repetido).length,
      formularios: eventos.filter((e) => e.tipo === "formulario"),
      eventos,
    };
    const blob = new Blob([JSON.stringify(resumen, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = U.el("a", { href: url, download: "grabacion_MP2026_" + U.todayISO() + "_" + Date.now() + ".json" });
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    MP.ui.toast("Grabación detenida y descargada (" + eventos.length + " eventos).", "ok");
  };

  Rec.toggle = function () { activa ? Rec.stop() : Rec.start(); };

  function describir(tgt) {
    if (!tgt || !tgt.tagName) return "documento";
    let d = tgt.tagName.toLowerCase();
    if (tgt.id) d += "#" + tgt.id;
    else if (tgt.className && typeof tgt.className === "string") {
      const c = tgt.className.split(/\s+/).filter(Boolean).slice(0, 2).join(".");
      if (c) d += "." + c;
    }
    const txt = (tgt.textContent || "").trim().slice(0, 24);
    if (txt && (tgt.tagName === "BUTTON" || tgt.tagName === "A")) d += " «" + txt + "»";
    return d;
  }

})(window);

    opciones.forEach((o) => {
